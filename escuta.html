<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Rádio - Ativação por Voz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 650px;
            width: 100%;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            margin: 10px;
            transition: 0.3s;
        }
        #btnStart { background-color: #28a745; color: white; }
        #btnStart:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; color: white; }
        #btnStop:hover { background-color: #c82333; }
        
        #status {
            font-size: 18px;
            margin: 15px 0;
            font-weight: bold;
        }
        .status-parado { color: #ffc107; }
        .status-escutando { color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.6); }
        .status-ouvindo-voz { color: #28a745; text-shadow: 0 0 8px rgba(40,167,69,0.8); }

        #translog {
            margin-top: 20px;
            background: #111;
            border: 1px solid #333;
            height: 160px;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
            color: #00ffcc;
        }
        .highlight {
            color: #ff3333;
            font-weight: bold;
        }
        body.alerta-ativo {
            background-color: #550000 !important;
            animation: piscar 0.5s infinite alternate;
        }
        @keyframes piscar {
            from { background-color: #550000; }
            to { background-color: #990000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitor de Rádio (Detecção Inteligente)</h2>
    <p>Buscando por: <strong>1ª Cia | CGP 11 | CGP 1</strong></p>
    
    <div id="status" class="status-parado">Status: Parado</div>
    
    <div>
        <button id="btnStart" onclick="iniciarMonitoramento()">Iniciar Monitoramento</button>
        <button id="btnStop" onclick="pararMonitoramento()">Parar</button>
        <button id="btnPararAlerta" onclick="pararAlerta()" style="background-color: #ffc107; color: #000; display:none;">Parar Alerta Sonoro</button>
    </div>

    <h3>Log de Eventos:</h3>
    <div id="translog">Aguardando início...</div>
</div>

<script>
    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let javascriptNode = null;
    let recognition = null;
    let isRunning = false;
    let isTranscribing = false;
    let sirenInterval = null;

    function normalizarTexto(texto) {
        return texto.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/primeira/g, "1a")
            .replace(/1 a/g, "1a")
            .replace(/uma cia/g, "1a cia")
            .replace(/cia/g, " cia ")
            .replace(/c g p/g, "cgp")
            .replace(/c\.g\.p/g, "cgp")
            .replace(/onze/g, "11")
            .replace(/um um/g, "11")
            .replace(/cgp um/g, "cgp 1")
            .replace(/cgp primeiro/g, "cgp 1")
            .replace(/\s+/g, " ")
            .trim();
    }

    async function iniciarMonitoramento() {
        if (isRunning) return;
        isRunning = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            microphone = audioCtx.createMediaStreamSource(stream);
            
            analyser.fftSize = 512;
            microphone.connect(analyser);

            configurarReconhecimentoVoz();

            document.getElementById("status").innerText = "Status: Monitorando silêncio (Aguardando fala...)";
            document.getElementById("status").className = "status-escutando";
            adicionarLog("[Sistema iniciado - Aguardando transmissão de rádio]");

            // Loop de análise de volume em tempo real
            analisarVolume();

        } catch (err) {
            alert("Erro ao acessar o microfone. Verifique as permissões.");
            pararMonitoramento();
        }
    }

    function analisarVolume() {
        if (!isRunning) return;

        let array = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(array);
        
        let valores = 0;
        for (let i = 0; i < array.length; i++) {
            valores += array[i];
        }
        let mediaVolume = valores / array.length;

        // Se o volume passar de um limite (significa que alguém começou a falar no rádio)
        // e o sistema já não estiver transcrevendo, ele ativa o reconhecimento de voz.
        const LIMITE_VOLUME = 12; // Ajuste se estiver sensível demais ou de menos

        if (mediaVolume > LIMITE_VOLUME && !isTranscribing) {
            iniciarTranscricao();
        }

        requestAnimationFrame(analisarVolume);
    }

    function configurarReconhecimentoVoz() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false; // Processa a frase curta e fecha
        recognition.interimResults = true;

        recognition.onresult = function(event) {
            let textoCompleto = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                textoCompleto += event.results[i][0].transcript;
            }

            if (textoCompleto.trim() !== "") {
                adicionarLog("Ouvido: " + textoCompleto);
                verificarTermos(textoCompleto);
            }
        };

        recognition.onend = function() {
            // Quando a frase do rádio acaba, libera para esperar a próxima
            isTranscribing = false;
            if (isRunning) {
                document.getElementById("status").innerText = "Status: Monitorando silêncio (Aguardando fala...)";
                document.getElementById("status").className = "status-escutando";
            }
        };
    }

    function iniciarTranscricao() {
        if (!recognition || isTranscribing) return;
        try {
            isTranscribing = true;
            recognition.start();
            document.getElementById("status").innerText = "Status: Voz detectada! Analisando...";
            document.getElementById("status").className = "status-ouvindo-voz";
        } catch (e) {
            isTranscribing = false;
        }
    }

    function pararMonitoramento() {
        isRunning = false;
        isTranscribing = false;
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        if (audioCtx) {
            audioCtx.close();
        }
        document.getElementById("status").innerText = "Status: Parado";
        document.getElementById("status").className = "status-parado";
        adicionarLog("[Sistema parado]");
    }

    function verificarTermos(textoBruto) {
        let texto = normalizarTexto(textoBruto);
        
        const regex1aCia = /1a\s*cia|primeira\s*companhia|1\s*companhia/i;
        const regexCgp11 = /cgp\s*11|cgp\s*onze|cgp\s*um\s*um/i;
        const regexCgp1  = /cgp\s*1\b|cgp\s*um\b|cgp\s*primeiro\b/i;

        if (regex1aCia.test(texto) || regexCgp11.test(texto) || regexCgp1.test(texto)) {
            dispararAlertaVisualESonoro();
            destacarLogUltimaFrase(textoBruto);
        }
    }

    function tocarSirene() {
        if (!audioCtx || audioCtx.state === 'closed') {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();

        osc.type = 'sine';
        let now = audioCtx.currentTime;
        
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.7);
        osc.frequency.linearRampToValueAtTime(500, now + 1.4);

        gainNode.gain.setValueAtTime(0.3, now);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 1.4);
    }

    function dispararAlertaVisualESonoro() {
        document.body.classList.add("alerta-ativo");
        document.getElementById("btnPararAlerta").style.display = "inline-block";

        if (!sirenInterval) {
            tocarSirene();
            sirenInterval = setInterval(tocarSirene, 1500);
        }
    }

    function pararAlerta() {
        document.body.classList.remove("alerta-ativo");
        document.getElementById("btnPararAlerta").style.display = "none";
        if (sirenInterval) {
            clearInterval(sirenInterval);
            sirenInterval = null;
        }
    }

    function adicionarLog(texto) {
        const logDiv = document.getElementById("translog");
        const horario = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${horario}] ${texto}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function destacarLogUltimaFrase(textoBruto) {
        const logDiv = document.getElementById("translog");
        const horario = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<span class="highlight">[${horario}] ALERTA DETECTADO: "${textoBruto}"</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>

</body>
</html>

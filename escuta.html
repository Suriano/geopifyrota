<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Rádio - Mobile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            transition: background-color 0.5s;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 100%;
            width: 100%;
        }
        button {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            margin: 8px 4px;
            width: 100%;
            max-width: 250px;
        }
        #btnStart { background-color: #28a745; color: white; }
        #btnStop { background-color: #dc3545; color: white; }
        
        #status {
            font-size: 16px;
            margin: 15px 0;
            font-weight: bold;
        }
        .status-parado { color: #ffc107; }
        .status-escutando { color: #28a745; }

        #translog {
            margin-top: 15px;
            background: #111;
            border: 1px solid #333;
            height: 180px;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
        }
        .highlight {
            color: #ff3333;
            font-weight: bold;
        }
        body.alerta-ativo {
            background-color: #550000 !important;
            animation: piscar 0.5s infinite alternate;
        }
        @keyframes piscar {
            from { background-color: #550000; }
            to { background-color: #990000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitor de Rádio (Celular)</h2>
    <p style="font-size: 13px; color: #aaa;">Termos: <strong>1ª Cia | CGP 11 | CGP 1</strong></p>
    
    <div id="status" class="status-parado">Status: Parado</div>
    
    <div>
        <button id="btnStart" onclick="iniciarEscuta()">Iniciar Escuta</button>
        <button id="btnStop" onclick="pararEscuta()">Parar</button>
        <button id="btnPararAlerta" onclick="pararAlerta()" style="background-color: #ffc107; color: #000; display:none;">Parar Alerta Sonoro</button>
    </div>

    <h3>Registro de Voz:</h3>
    <div id="translog">Toque em "Iniciar Escuta" e mantenha a tela ligada...</div>
</div>

<script>
    let recognition = null;
    let isListening = false;
    let audioCtx = null;
    let sirenInterval = null;

    function normalizarTexto(texto) {
        return texto.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/primeira/g, "1a")
            .replace(/1 a/g, "1a")
            .replace(/uma cia/g, "1a cia")
            .replace(/cia/g, " cia ")
            .replace(/c g p/g, "cgp")
            .replace(/c\.g\.p/g, "cgp")
            .replace(/onze/g, "11")
            .replace(/um um/g, "11")
            .replace(/cgp um/g, "cgp 1")
            .replace(/cgp primeiro/g, "cgp 1")
            .replace(/\s+/g, " ")
            .trim();
    }

    function iniciarEscuta() {
        if (isListening) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Seu navegador não suporta reconhecimento de voz. Use o Google Chrome no Android.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function() {
            isListening = true;
            document.getElementById("status").innerText = "Status: Ouvindo ativamente...";
            document.getElementById("status").className = "status-escutando";
            adicionarLog("[Microfone ativado no celular]");
        };

        recognition.onresult = function(event) {
            let textoCompleto = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                textoCompleto += event.results[i][0].transcript;
            }

            if (textoCompleto.trim() !== "") {
                adicionarLog("Ouvido: " + textoCompleto);
                verificarTermos(textoCompleto);
            }
        };

        recognition.onerror = function(event) {
            adicionarLog("[Aviso: " + event.error + "]");
        };

        recognition.onend = function() {
            if (isListening) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Reiniciando...");
                }
            }
        };

        try {
            recognition.start();
        } catch (e) {
            alert("Erro ao iniciar microfone. Verifique se permitiu o uso.");
            isListening = false;
        }
    }

    function pararEscuta() {
        isListening = false;
        if (recognition) {
            recognition.stop();
        }
        document.getElementById("status").innerText = "Status: Parado";
        document.getElementById("status").className = "status-parado";
        adicionarLog("[Parado]");
    }

    function verificarTermos(textoBruto) {
        let texto = normalizarTexto(textoBruto);
        
        const regex1aCia = /1a\s*cia|primeira\s*companhia|1\s*companhia/i;
        const regexCgp11 = /cgp\s*11|cgp\s*onze|cgp\s*um\s*um/i;
        const regexCgp1  = /cgp\s*1\b|cgp\s*um\b|cgp\s*primeiro\b/i;

        if (regex1aCia.test(texto) || regexCgp11.test(texto) || regexCgp1.test(texto)) {
            dispararAlertaVisualESonoro();
            destacarLogUltimaFrase(textoBruto);
        }
    }

    function tocarSirene() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();

        osc.type = 'sine';
        let now = audioCtx.currentTime;
        
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.7);
        osc.frequency.linearRampToValueAtTime(500, now + 1.4);

        gainNode.gain.setValueAtTime(0.3, now);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 1.4);
    }

    function dispararAlertaVisualESonoro() {
        document.body.classList.add("alerta-ativo");
        document.getElementById("btnPararAlerta").style.display = "inline-block";

        if (!sirenInterval) {
            tocarSirene();
            sirenInterval = setInterval(tocarSirene, 1500);
        }
    }

    function pararAlerta() {
        document.body.classList.remove("alerta-ativo");
        document.getElementById("btnPararAlerta").style.display = "none";
        if (sirenInterval) {
            clearInterval(sirenInterval);
            sirenInterval = null;
        }
    }

    function adicionarLog(texto) {
        const logDiv = document.getElementById("translog");
        const horario = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${horario}] ${texto}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function destacarLogUltimaFrase(textoBruto) {
        const logDiv = document.getElementById("translog");
        const horario = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<span class="highlight">[${horario}] ALERTA DETECTADO: "${textoBruto}"</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>

</body>
</html>

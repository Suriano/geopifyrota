<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota com Geoapify e Leaflet</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #header {
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>Calculadora de Rota com Geoapify</h2>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Insira sua chave da API do Geoapify aqui
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        // 2. Inicialize o mapa centrado em uma localização inicial (ex: São Paulo)
        const map = L.map('map').setView([-23.5505, -46.6333], 13);

        // 3. Adicione o estilo de mapa do Geoapify
        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by <a href="https://www.geoapify.com/" target="_blank">Geoapify</a> | <a href="https://openmaptiles.org/" target="_blank">© OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        // 4. Defina os pontos de partida (Origem) e chegada (Destino) - Formato: [Latitude, Longitude]
        const origem = [-23.5505, -46.6333]; // Ex: Praça da Sé, SP
        const destino = [-23.5614, -46.6565]; // Ex: Avenida Paulista, SP

        // Adicione marcadores nos pontos
        L.marker(origem).addTo(map).bindPopup("<b>Início da Rota</b>").openPopup();
        L.marker(destino).addTo(map).bindPopup("<b>Destino</b>");

        // 5. Requisição para a API de Roteamento do Geoapify
        const routingUrl = `https://api.geoapify.com/v1/routing?waypoints=${origem[0]},${origem[1]}|${destino[0]},${destino[1]}&mode=drive&apiKey=${apiKey}`;

        fetch(routingUrl)
            .then(response => response.json())
            .then(result => {
                if (result.features && result.features.length > 0) {
                    // Desenha a linha da rota no mapa usando GeoJSON retornado pela API
                    L.geoJSON(result, {
                        style: {
                            color: "#3498db",
                            weight: 6,
                            opacity: 0.8
                        }
                    }).addTo(map);

                    // Ajusta o zoom do mapa para abranger toda a rota
                    const bounds = L.geoJSON(result).getBounds();
                    map.fitBounds(bounds, { padding: [50, 50] });
                } else {
                    alert("Não foi possível encontrar uma rota.");
                }
            })
            .catch(error => console.log('Erro ao buscar a rota:', error));
    </script>
</body>
</html>

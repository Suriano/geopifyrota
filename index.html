<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Motociclista com Nome da Rua</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        #header {
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        #controls {
            padding: 8px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
        }
        button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2c3e50;
        }
        #btn-voz {
            background-color: #e67e22;
        }
        #btn-voz:hover {
            background-color: #d35400;
        }
        #btn-gravar {
            background-color: #c0392b;
        }
        #btn-gravar.gravando {
            background-color: #7f8c8d;
            animation: pulsar 1.5s infinite;
        }
        #btn-marcar {
            background-color: #f39c12;
        }
        @keyframes pulsar {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #instructions {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
            font-size: 14px;
        }
        #map {
            width: 100%;
            height: calc(100vh - 170px);
            touch-action: none; 
        }
        .moto-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>🏍️ GPS Motociclista & Ruas</h2>
    </div>

    <div id="controls">
        <button id="btn-localizacao">📍 Local</button>
        <button id="btn-voz">🎤 Destino</button>
        <button id="btn-gravar">🔴 Gravar Rota</button>
        <button id="btn-marcar">⭐ Marcar Ponto</button>
    </div>
    
    <div id="instructions">Clique no mapa ou toque em "Local" para ver o nome da rua.</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Rotate JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: {
                position: "topright",
                behavior: "reset"
            }
        }).setView([-23.5505, -46.6333], 13);

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let destino = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routeLayer = null;

        let isGravando = false;
        let watchId = null;
        let coordsGravadas = [];
        let pontosDeMelhoria = [];
        let trackLayer = null;
        let marcadoresMelhoriaLayers = [];
        let ruaAtualNome = "Aguardando...";
        let ultimaChamadaRua = 0;

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnVoz = document.getElementById('btn-voz');
        const btnGravar = document.getElementById('btn-gravar');
        const btnMarcar = document.getElementById('btn-marcar');

        function criarIconeMoto() {
            return L.divIcon({
                className: 'moto-icon',
                html: '🏍️',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        // Função para buscar o nome da rua por coordenadas (Geocodificação Reversa)
        function obterNomeRuaPorCoord(lat, lon, callback) {
            const url = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${apiKey}&lang=pt`;

            fetch(url)
                .then(res => res.json())
                .then(result => {
                    let nomeFormatado = "Rua não identificada";
                    if (result.features && result.features.length > 0) {
                        const props = result.features[0].properties;
                        const rua = props.street || props.name || props.formatted || "Via sem nome";
                        const bairro = props.suburb || props.city || "";
                        nomeFormatado = bairro ? `${rua} (${bairro})` : rua;
                    }
                    if (callback) callback(nomeFormatado);
                })
                .catch(err => {
                    console.log("Erro ao buscar rua:", err);
                    if (callback) callback("Erro ao carregar nome da rua");
                });
        }

        function calcularRota() {
            const routingUrl = `https://api.geoapify.com/v1/routing?waypoints=${origem[0]},${origem[1]}|${destino[0]},${destino[1]}&mode=drive&apiKey=${apiKey}`;

            fetch(routingUrl)
                .then(response => response.json())
                .then(result => {
                    if (result.features && result.features.length > 0) {
                        if (routeLayer) map.removeLayer(routeLayer);

                        routeLayer = L.geoJSON(result, {
                            style: { color: "#e67e22", weight: 6, opacity: 0.8 }
                        }).addTo(map);

                        const bounds = routeLayer.getBounds();
                        map.fitBounds(bounds, { padding: [50, 50] });

                        instructionsDiv.innerHTML = "Rota traçada para moto! Boa viagem! 🏍️";
                        falarTexto("Rota calculada com sucesso.");
                    } else {
                        alert("Não foi possível encontrar uma rota.");
                    }
                })
                .catch(error => console.log('Erro ao buscar rota:', error));
        }

        // Gravação em tempo real
        btnGravar.addEventListener('click', function() {
            if (!isGravando) {
                if (!navigator.geolocation) {
                    alert("Geolocalização não suportada.");
                    return;
                }

                coordsGravadas = [];
                pontosDeMelhoria = [];
                isGravando = true;
                btnGravar.textContent = "⏹️ Parar Gravação";
                btnGravar.classList.add('gravando');
                instructionsDiv.innerHTML = "🔴 Iniciando rastreio...";
                falarTexto("Gravação de rota iniciada.");

                if (trackLayer) map.removeLayer(trackLayer);
                marcadoresMelhoriaLayers.forEach(m => map.removeLayer(m));
                marcadoresMelhoriaLayers = [];

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const novaCoord = [lat, lon];

                        coordsGravadas.push(novaCoord);
                        map.setView(novaCoord, 16);

                        if (markerOrigem) map.removeLayer(markerOrigem);
                        markerOrigem = L.marker(novaCoord, { icon: criarIconeMoto() }).addTo(map);

                        if (trackLayer) map.removeLayer(trackLayer);
                        trackLayer = L.polyline(coordsGravadas, { color: '#c0392b', weight: 5 }).addTo(map);

                        const agora = Date.now();
                        if (agora - ultimaChamadaRua > 6000) {
                            ultimaChamadaRua = agora;
                            obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                                ruaAtualNome = nomeRua;
                                if (isGravando) {
                                    instructionsDiv.innerHTML = `🏍️ <b>Rua atual:</b> ${ruaAtualNome}`;
                                }
                            });
                        }
                    },
                    (error) => { console.error("Erro GPS:", error); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );

            } else {
                isGravando = false;
                navigator.geolocation.clearWatch(watchId);
                btnGravar.textContent = "🔴 Gravar Rota";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "✅ Gravação encerrada e arquivo gerado!";
                falarTexto("Gravação encerrada.");

                const dadosRota = {
                    data: new Date().toISOString(),
                    trajeto: coordsGravadas,
                    pontosMelhoria: pontosDeMelhoria
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dadosRota));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `moto_trajeto_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            }
        });

        btnMarcar.addEventListener('click', function() {
            if (!isGravando) {
                alert("Inicie a gravação da rota primeiro!");
                return;
            }
            if (coordsGravadas.length === 0) {
                alert("Aguardando sinal de GPS.");
                return;
            }

            const ultimaPos = coordsGravadas[coordsGravadas.length - 1];
            const nota = prompt(`Localizado em: ${ruaAtualNome}\n\nAdicionar nota (Ex: 'Radar', 'Trânsito'):`, "Ponto de atenção");

            if (nota !== null) {
                const pontoInfo = {
                    coordenadas: ultimaPos,
                    rua: ruaAtualNome,
                    comentario: nota,
                    horario: new Date().toLocaleTimeString()
                };
                pontosDeMelhoria.push(pontoInfo);

                const marcador = L.marker(ultimaPos).addTo(map)
                    .bindPopup(`<b>⭐ ${ruaAtualNome}</b><br>${nota}`)
                    .openPopup();

                marcadoresMelhoriaLayers.push(marcador);
                falarTexto("Ponto marcado.");
            }
        });

        btnLocalizacao.addEventListener('click', function() {
            if (!navigator.geolocation) return;
            instructionsDiv.innerHTML = "Obtendo localização...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                origem = [lat, lon];
                map.setView(origem, 15);

                obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                    ruaAtualNome = nomeRua;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Você está aqui</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>${ruaAtualNome}</b>`;
                });
            }, () => { alert("Erro ao obter localização."); }, { enableHighAccuracy: true });
        });

        btnVoz.addEventListener('click', function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Reconhecimento de voz não suportado.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            instructionsDiv.innerHTML = "Ouvindo destino...";
            falarTexto("Pode falar o destino.");
            recognition.start();

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                instructionsDiv.innerHTML = `Buscando: <b>${textoFalado}</b>`;
                fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(textoFalado)}&apiKey=${apiKey}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.features && data.features.length > 0) {
                            const coords = data.features[0].geometry.coordinates;
                            destino = [coords[1], coords[0]];
                            if (markerDestino) map.removeLayer(markerDestino);
                            markerDestino = L.marker(destino).addTo(map).bindPopup(`<b>Destino:</b> ${textoFalado}`).openPopup();
                            if (!origem) {
                                alert("Defina o ponto de partida primeiro!");
                                return;
                            }
                            calcularRota();
                        } else {
                            alert("Endereço não encontrado.");
                        }
                    });
            };
        });

        // Clique manual no mapa descobre o nome da rua imediatamente
        map.on('click', function(e) {
            if (isGravando) return;
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            const latLng = [lat, lon];

            instructionsDiv.innerHTML = "Buscando nome da rua...";

            obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                ruaAtualNome = nomeRua;

                if (!origem) {
                    origem = latLng;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Origem:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>Origem:</b> ${ruaAtualNome}`;
                } else if (!destino) {
                    destino = latLng;
                    if (markerDestino) map.removeLayer(markerDestino);
                    markerDestino = L.marker(destino).addTo(map)
                        .bindPopup(`<b>Destino:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `🏁 Calculando rota para: ${ruaAtualNome}`;
                    calcularRota();
                } else {
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    if (markerDestino) map.removeLayer(markerDestino);
                    if (routeLayer) map.removeLayer(routeLayer);
                    origem = latLng;
                    destino = null;
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Nova Origem:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>Nova Origem:</b> ${ruaAtualNome}`;
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS RPM & QTH Patrulhamento</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        #header {
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        #controls {
            padding: 8px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
            align-items: center;
        }
        button, .autocomplete-container input {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #2c3e50;
        }
        
        #btn-voz-container {
            position: relative;
            display: inline-block;
        }
        #input-destino {
            background-color: #e67e22;
            color: white;
            width: 160px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            outline: none;
        }
        #input-destino::placeholder {
            color: white;
            opacity: 0.9;
        }
        #sugestoes-destino {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            display: none;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }
        .sugestao-item {
            padding: 8px 10px;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-weight: normal;
            text-transform: uppercase;
        }
        .sugestao-item:hover {
            background-color: #f1f2f6;
        }

        #btn-gravar { background-color: #c0392b; min-width: 140px; }
        #btn-gravar.gravando { background-color: #7f8c8d; animation: pulsar 1.5s infinite; }
        #btn-marcar { background-color: #f39c12; }
        #btn-importar { background-color: #2980b9; }
        #btn-limpar { background-color: #7f8c8d; }

        @keyframes pulsar {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #instructions {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
            font-size: 14px;
        }

        #painel-relatorio {
            display: none;
            background: #ffffff;
            border-bottom: 2px solid #2c3e50;
            padding: 12px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 12px;
            box-shadow: inset 0 4px 6px -4px rgba(0,0,0,0.1);
        }
        .relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .relatorio-acoes {
            display: flex;
            gap: 5px;
        }
        #btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        #btn-editar {
            background-color: #d35400;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        .relatorio-conteudo {
            white-space: pre-wrap;
            color: #222;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            text-transform: uppercase;
        }
        #textarea-edicao {
            width: 100%;
            height: 140px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #34495e;
            border-radius: 4px;
            resize: vertical;
        }

        #map {
            width: 100%;
            height: calc(100vh - 190px);
            touch-action: none; 
        }
        .viatura-icon { font-size: 24px; text-align: center; line-height: 24px; }
    </style>
</head>
<body>

    <div id="header">
        <h2>RELATÓRIO DE SERVIÇO OPERACIONAL</h2>
        <small style="color: #bdc3c7;">ACESSOS: <span id="contador-visitas">CARREGANDO...</span></small>
    </div>

    <div id="controls">
        <button id="btn-localizacao">📍 LOCAL</button>
        
        <div id="btn-voz-container">
            <input type="text" id="input-destino" placeholder="🔍 DESTINO..." autocomplete="off">
            <div id="sugestoes-destino"></div>
        </div>

        <button id="btn-gravar">🔴 GRAVAR ROTA</button>
        <button id="btn-marcar">⭐ MARCAR PONTO</button>
        <button id="btn-importar">📂 ABRIR</button>
        <button id="btn-limpar">🧹 NOVO / LIMPAR</button>
        <input type="file" id="input-json" style="display: none;" />
    </div>
    
    <div id="instructions">OBTENDO SUA LOCALIZAÇÃO ATUAL...</div>

    <div id="painel-relatorio">
        <div class="relatorio-header">
            <strong>HISTÓRICO DE OPERAÇÕES:</strong>
            <div class="relatorio-acoes">
                <button id="btn-editar">✏️ EDITAR</button>
                <button id="btn-whatsapp">💬 WHATSAPP</button>
            </div>
        </div>
        <div id="texto-relatorio-visivel" class="relatorio-conteudo"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: { position: "topright", behavior: "reset" }
        });

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routingLayer = null;

        let isGravando = false;
        let watchId = null;
        let tempoGravacaoInterval = null;
        let segundosGravados = 0;
        let wakeLock = null; // Controle para evitar suspensão da tela

        const distanciaMinimaMetros = 100; 
        let ultimaCoordenadaSalva = null;
        let ultimaRuaSalva = "";

        let registrosTrajeto = [];
        let pontosDeMelhoria = [];
        let trackLayer = null;
        let marcadoresMelhoriaLayers = [];
        let ruaAtualNome = "AGUARDANDO...";
        let ultimaLat = null;
        let ultimaLon = null;
        let textoRelatorioPronto = "";
        let emModoEdicao = false;

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnGravar = document.getElementById('btn-gravar');
        const btnMarcar = document.getElementById('btn-marcar');
        const btnImportar = document.getElementById('btn-importar');
        const btnLimpar = document.getElementById('btn-limpar');
        const btnWhatsapp = document.getElementById('btn-whatsapp');
        const btnEditar = document.getElementById('btn-editar');
        const inputJson = document.getElementById('input-json');
        const painelRelatorio = document.getElementById('painel-relatorio');
        const textoRelatorioVisivel = document.getElementById('texto-relatorio-visivel');
        
        const inputDestino = document.getElementById('input-destino');
        const sugestoesDestino = document.getElementById('sugestoes-destino');

        // Dados dos setores (mantidos igual ao seu código)
        const dadosSetoresKML = [
            {
                nome: "101",
                cor: "#558B2F",
                descricao: "Rua Dom Paulo Mariano<br>Av. Imperador Pedro II",
                coordenadas: [
                    [-23.6966454, -46.5507877], [-23.6977212, -46.5511418], [-23.6984236, -46.5514153], [-23.6987134, -46.5515655], [-23.6994564, -46.551984], [-23.7000065, -46.552212], [-23.7006205, -46.5525097], [-23.7009717, -46.5526948], [-23.7013057, -46.5528637], [-23.7015022, -46.5529388], [-23.7018657, -46.5529844], [-23.7020474, -46.5529764], [-23.7022169, -46.5529388], [-23.702627, -46.5527859], [-23.7032398, -46.552499], [-23.7034584, -46.5524024], [-23.7038219, -46.5522334], [-23.7041436, -46.5521288], [-23.7043057, -46.5520993], [-23.7045562, -46.5520671], [-23.7046495, -46.5520698], [-23.704873, -46.5520993], [-23.7050866, -46.5521556], [-23.7051652, -46.5521905], [-23.7052561, -46.5518338], [-23.7053224, -46.5515012], [-23.7053985, -46.5512705], [-23.7056392, -46.5506295], [-23.7058676, -46.5501735], [-23.706015, -46.5499079], [-23.7063858, -46.5491918], [-23.7065602, -46.5488699], [-23.706791, -46.5484166], [-23.7071054, -46.5478346], [-23.707405, -46.5474108], [-23.7076604, -46.5470889], [-23.7079846, -46.5467322], [-23.7084168, -46.5463299], [-23.7087704, -46.5460107], [-23.7091978, -46.54567], [-23.70928, -46.5456017], [-23.7097528, -46.5451873], [-23.7085249, -46.5454474], [-23.7084757, -46.5454635], [-23.7084242, -46.5454608], [-23.7083922, -46.545434], [-23.70838, -46.5453831], [-23.7086256, -46.5448305], [-23.7077881, -46.5444121], [-23.7074271, -46.5442458], [-23.7073608, -46.544227], [-23.706489, -46.5437603], [-23.7064251, -46.5437228], [-23.7046642, -46.5428269], [-23.7037703, -46.5424514], [-23.7036991, -46.5424138], [-23.7034731, -46.5422878], [-23.7033896, -46.5422636], [-23.7030581, -46.54221], [-23.70295, -46.5421751], [-23.7028247, -46.5421188], [-23.702724, -46.5420571], [-23.7024981, -46.541974], [-23.7024662, -46.542041], [-23.701808, -46.543704], [-23.7017687, -46.5438166], [-23.7016778, -46.5442565], [-23.7016385, -46.5444577], [-23.7015305, -46.5447232], [-23.7009729, -46.5458793], [-23.7005456, -46.5457398], [-23.7000249, -46.5456003], [-23.6997007, -46.5455145], [-23.6991702, -46.5454233], [-23.6989345, -46.5453804], [-23.6981191, -46.5451604], [-23.6980601, -46.5454233], [-23.6979864, -46.5461046], [-23.6978784, -46.5470863], [-23.6978342, -46.5473974], [-23.69779, -46.5480465], [-23.6977507, -46.5484756], [-23.697677, -46.5487653], [-23.6975051, -46.5491086], [-23.6968714, -46.5505195], [-23.6968174, -46.5506214], [-23.6966454, -46.5507877]
                ]
            }
        ];

        dadosSetoresKML.forEach(setor => {
            if (setor.coordenadas && setor.coordenadas.length > 0) {
                const polygon = L.polygon(setor.coordenadas, {
                    color: setor.cor,
                    weight: 2,
                    fillColor: setor.cor,
                    fillOpacity: 0.35
                }).addTo(map);
                polygon.bindPopup(`<b>SETOR: ${setor.nome}</b><br>${setor.descricao}`);
            }
        });

        function criarIconeViatura() {
            return L.divIcon({
                className: 'viatura-icon',
                html: '🚔',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function emitirSomSalvamento() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Áudio bloqueado.", e);
            }
        }

        // Função para manter a tela ativa via Wake Lock API
        async function ativarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock ativo: a tela não vai apagar.');
                } catch (err) {
                    console.error('Erro ao ativar Wake Lock:', err);
                }
            }
        }

        function liberarWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    console.log('Wake Lock liberado.');
                });
            }
        }

        // Reativar Wake Lock se o usuário voltar para a aba e estiver gravando
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isGravando) {
                await ativarWakeLock();
            }
        });

        function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function obterNomeRuaPorCoord(lat, lon, callback) {
            const url = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${apiKey}&lang=pt`;
            fetch(url)
                .then(res => res.json())
                .then(result => {
                    let nomeFormatado = "VIA NÃO IDENTIFICADA";
                    if (result.features && result.features.length > 0) {
                        const props = result.features[0].properties;
                        const rua = props.street || props.name || "VIA SEM NOME";
                        const numero = props.housenumber ? `, ${props.housenumber}` : "";
                        const bairro = props.suburb || props.city || "";
                        nomeFormatado = bairro ? `${rua}${numero} (${bairro})` : `${rua}${numero}`;
                    }
                    if (callback) callback(nomeFormatado.toUpperCase());
                })
                .catch(() => {
                    if (callback) callback("VIA NÃO IDENTIFICADA");
                });
        }

        function salvarEstadoLocal() {
            const estado = {
                registrosTrajeto,
                pontosDeMelhoria,
                textoRelatorioPronto,
                temRelatorioVisivel: painelRelatorio.style.display === "block",
                isGravando,
                segundosGravados
            };
            localStorage.setItem('gps_rpm_estado_atual', JSON.stringify(estado));
        }

        function avaliarRegistroPorDistanciaOuEndereco() {
            if (!isGravando || ultimaLat === null || ultimaLon === null) return;

            const novaCoord = [ultimaLat, ultimaLon];
            const horaAtual = new Date().toLocaleTimeString('pt-BR');

            obterNomeRuaPorCoord(ultimaLat, ultimaLon, (nomeRua) => {
                ruaAtualNome = nomeRua;
                let deveSalvar = false;

                if (!ultimaCoordenadaSalva) {
                    deveSalvar = true;
                } else {
                    const distancia = calcularDistanciaMetros(
                        ultimaCoordenadaSalva[0], ultimaCoordenadaSalva[1],
                        ultimaLat, ultimaLon
                    );

                    if (distancia >= distanciaMinimaMetros && ruaAtualNome !== ultimaRuaSalva && ruaAtualNome !== "VIA NÃO IDENTIFICADA") {
                        deveSalvar = true;
                    }
                }

                if (deveSalvar) {
                    ultimaCoordenadaSalva = novaCoord;
                    ultimaRuaSalva = ruaAtualNome;

                    registrosTrajeto.push({ 
                        hora: horaAtual, 
                        rua: ruaAtualNome, 
                        coordenadas: novaCoord 
                    });
                    salvarEstadoLocal();
                    emitirSomSalvamento();

                    if (trackLayer) map.removeLayer(trackLayer);
                    trackLayer = L.polyline(registrosTrajeto.map(i => i.coordenadas), { color: '#c0392b', weight: 5 }).addTo(map);
                    instructionsDiv.innerHTML = `📍 PONTO SALVO (${horaAtual}): <b>${ruaAtualNome}</b>`;
                }
            });
        }

        function iniciarRastreamentoGlobal() {
            if (!navigator.geolocation) return;

            watchId = navigator.geolocation.watchPosition((position) => {
                ultimaLat = position.coords.latitude;
                ultimaLon = position.coords.longitude;
                const novaCoord = [ultimaLat, ultimaLon];
                
                map.setView(novaCoord, map.getZoom());
                if (markerOrigem) map.removeLayer(markerOrigem);
                markerOrigem = L.marker(novaCoord, { icon: criarIconeViatura() }).addTo(map);

                if (isGravando) {
                    avaliarRegistroPorDistanciaOuEndereco();
                }

            }, (err) => {
                console.error("Erro de GPS:", err);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        function restaurarEstadoLocal() {
            const salvo = localStorage.getItem('gps_rpm_estado_atual');
            if (!salvo) return;

            try {
                const estado = JSON.parse(salvo);
                registrosTrajeto = estado.registrosTrajeto || [];
                pontosDeMelhoria = estado.pontosDeMelhoria || [];
                textoRelatorioPronto = estado.textoRelatorioPronto || "";
                isGravando = estado.isGravando || false;
                segundosGravados = estado.segundosGravados || 0;

                if (estado.temRelatorioVisivel && textoRelatorioPronto) {
                    textoRelatorioVisivel.textContent = textoRelatorioPronto;
                    painelRelatorio.style.display = "block";
                }

                const coordsValidas = registrosTrajeto.map(i => i.coordenadas).filter(c => c);
                if (coordsValidas.length > 0) {
                    trackLayer = L.polyline(coordsValidas, { color: isGravando ? '#c0392b' : '#2980b9', weight: 5 }).addTo(map);
                    map.fitBounds(trackLayer.getBounds(), { padding: [50, 50] });
                    ultimaCoordenadaSalva = coordsValidas[coordsValidas.length - 1];
                }

                if (isGravando) {
                    btnGravar.classList.add('gravando');
                    ativarWakeLock();
                    tempoGravacaoInterval = setInterval(() => {
                        segundosGravados++;
                        btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                        salvarEstadoLocal();
                    }, 1000);
                    instructionsDiv.innerHTML = "🔴 RETOMANDO RASTREIO DE ROTA...";
                }
            } catch (e) {
                console.error("Erro ao recuperar estado", e);
            }
        }

        window.addEventListener('load', () => {
            centralizarNaMinhaLocalizacao();
            restaurarEstadoLocal();
            iniciarRastreamentoGlobal();
        });

        btnGravar.addEventListener('click', async function() {
            if (!isGravando) {
                if (!navigator.geolocation) { alert("GPS NÃO SUPORTADO."); return; }

                registrosTrajeto = [];
                pontosDeMelhoria = [];
                ultimaCoordenadaSalva = null;
                ultimaRuaSalva = "";
                isGravando = true;
                segundosGravados = 0;

                if (ultimaLat !== null && ultimaLon !== null) {
                    avaliarRegistroPorDistanciaOuEndereco();
                }

                btnGravar.classList.add('gravando');
                await ativarWakeLock(); // Evita que a tela apague durante a gravação

                tempoGravacaoInterval = setInterval(() => {
                    segundosGravados++;
                    btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                    salvarEstadoLocal();
                }, 1000);

                falarTexto("Gravação iniciada.");
            } else {
                isGravando = false;
                clearInterval(tempoGravacaoInterval);
                liberarWakeLock(); // Libera o bloqueio da tela

                btnGravar.textContent = "🔴 GRAVAR ROTA";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "✅ GRAVAÇÃO ENCERRADA E ARQUIVO GERADO!";
                falarTexto("Gravação encerrada.");

                const dadosRota = {
                    dataInicio: new Date().toLocaleDateString('pt-BR'),
                    tempoTotal: formatarTempo(segundosGravados),
                    historicoRuasETempo: registrosTrajeto,
                    pontosMarcados: pontosDeMelhoria
                };

                const jsonString = JSON.stringify(dadosRota, null, 2);
                const nomeSugestao = `viatura_trajeto_${new Date().toISOString().slice(0,10)}.json`;

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonString);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", nomeSugestao);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();

                localStorage.removeItem('gps_rpm_estado_atual');
            }
        });

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600);
            const m = Math.floor((segundos % 3600) / 60);
            const s = segundos % 60;
            return (h > 0 ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        btnLimpar.addEventListener('click', function() {
            if (confirm("Deseja realmente limpar os dados atuais?")) {
                if (isGravando) clearInterval(tempoGravacaoInterval);
                liberarWakeLock();
                localStorage.removeItem('gps_rpm_estado_atual');
                isGravando = false;
                registrosTrajeto = [];
                pontosDeMelhoria = [];
                ultimaCoordenadaSalva = null;
                ultimaRuaSalva = "";
                textoRelatorioPronto = "";
                textoRelatorioVisivel.textContent = "";
                painelRelatorio.style.display = "none";
                btnGravar.textContent = "🔴 GRAVAR ROTA";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "🧹 DADOS LIMPOS.";
            }
        });

        // Demais botões (Importar, Editar, WhatsApp, Marcar, etc. mantidos conforme seu script original)
        btnMarcar.addEventListener('click', function() {
            if (!isGravando) { alert("INICIE A GRAVAÇÃO PRIMEIRO!"); return; }
            if (registrosTrajeto.length === 0) { alert("AGUARDANDO SINAL DE GPS."); return; }
            const ultimo = registrosTrajeto[registrosTrajeto.length - 1];
            const nota = prompt(`LOCAL: ${ultimo.rua} ÀS ${ultimo.hora}\n\nDESCRIÇÃO:`, "ABORDAGEM REALIZADA");
            if (nota !== null) {
                const notaUpper = nota.toUpperCase();
                pontosDeMelhoria.push({ hora: ultimo.hora, rua: ultimo.rua, coordenadas: ultimo.coordenadas, comentario: notaUpper });
                salvarEstadoLocal();
                const m = L.marker(ultimo.coordenadas).addTo(map).bindPopup(`<b>${ultimo.rua}</b><br>${notaUpper}`).openPopup();
                marcadoresMelhoriaLayers.push(m);
                falarTexto("Ponto marcado.");
            }
        });

        btnLocalizacao.addEventListener('click', () => {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((pos) => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 16);
            });
        });
    </script>
</body>
</html>

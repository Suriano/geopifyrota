<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Ciclista com Rotação</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* Evita zoom indesejado no corpo da página no celular */
            touch-action: manipulation;
        }
        #header {
            padding: 12px;
            background-color: #27ae60;
            color: white;
            text-align: center;
        }
        #controls {
            padding: 10px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        #btn-voz {
            background-color: #e67e22;
        }
        #btn-voz:hover {
            background-color: #d35400;
        }
        #instructions {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #34495e;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
        }
        #map {
            width: 100%;
            height: calc(100vh - 160px);
            /* Essencial para liberar o movimento com dois dedos no mapa */
            touch-action: none; 
        }
        .bike-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>🚲 GPS Ciclista (Girar com os Dedos)</h2>
    </div>

    <div id="controls">
        <button id="btn-localizacao">📍 Minha Localização</button>
        <button id="btn-voz">🎤 Falar Destino</button>
    </div>
    
    <div id="instructions">Coloque dois dedos no mapa e gire para testar.</div>
    <div id="map"></div>

    <!-- Leaflet JS (Obrigatório vir antes da extensão) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Rotate JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        // Inicialização com suporte total a rotação por toque
        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: {
                position: "topright",
                behavior: "reset"
            }
        }).setView([-23.5505, -46.6333], 13);

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let destino = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routeLayer = null;

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnVoz = document.getElementById('btn-voz');

        function criarIconeBike() {
            return L.divIcon({
                className: 'bike-icon',
                html: '🚲',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;

            const voices = window.speechSynthesis.getVoices();
            const melhorVoz = voices.find(v => v.lang === 'pt-BR' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Neural'))) ||
                              voices.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');

            if (melhorVoz) utterance.voice = melhorVoz;
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function calcularRota() {
            const routingUrl = `https://api.geoapify.com/v1/routing?waypoints=${origem[0]},${origem[1]}|${destino[0]},${destino[1]}&mode=bicycle&apiKey=${apiKey}`;

            fetch(routingUrl)
                .then(response => response.json())
                .then(result => {
                    if (result.features && result.features.length > 0) {
                        if (routeLayer) map.removeLayer(routeLayer);

                        routeLayer = L.geoJSON(result, {
                            style: { color: "#27ae60", weight: 6, opacity: 0.8 }
                        }).addTo(map);

                        const bounds = routeLayer.getBounds();
                        map.fitBounds(bounds, { padding: [50, 50] });

                        instructionsDiv.innerHTML = "Rota traçada com sucesso! Bom pedal! 🚲🏁";
                        falarTexto("Rota calculada com sucesso. Bom pedal!");
                    } else {
                        alert("Não foi possível encontrar uma rota de bicicleta.");
                        falarTexto("Não foi possível encontrar uma rota.");
                    }
                })
                .catch(error => console.log('Erro ao buscar a rota:', error));
        }

        btnLocalizacao.addEventListener('click', function() {
            if (!navigator.geolocation) {
                alert("Geolocalização não suportada.");
                return;
            }

            instructionsDiv.innerHTML = "Obtendo sua localização atual...";
            falarTexto("Obtendo sua localização atual.");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    origem = [lat, lon];

                    map.setView(origem, 15);

                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeBike() })
                        .addTo(map)
                        .bindPopup("<b>Você está aqui</b>")
                        .openPopup();

                    instructionsDiv.innerHTML = "Localização obtida! Use o botão de voz para falar o destino.";
                    falarTexto("Localização obtida. Toque no botão laranja para falar o seu destino.");
                },
                (error) => {
                    alert("Erro ao obter localização. Verifique as permissões.");
                    falarTexto("Erro ao obter localização.");
                },
                { enableHighAccuracy: true }
            );
        });

        btnVoz.addEventListener('click', function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Reconhecimento de voz não suportado neste navegador. Use o Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            instructionsDiv.innerHTML = "Ouvindo... Diga o endereço ou local.";
            falarTexto("Pode falar, estou ouvindo.");

            recognition.start();

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                instructionsDiv.innerHTML = `Destino buscado: "<b>${textoFalado}</b>"`;
                falarTexto(`Buscando rota para ${textoFalado}`);

                const geocodingUrl = `https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(textoFalado)}&apiKey=${apiKey}`;

                fetch(geocodingUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.features && data.features.length > 0) {
                            const coords = data.features[0].geometry.coordinates;
                            destino = [coords[1], coords[0]];

                            if (markerDestino) map.removeLayer(markerDestino);
                            markerDestino = L.marker(destino)
                                .addTo(map)
                                .bindPopup(`<b>Destino:</b> ${textoFalado}`)
                                .openPopup();

                            if (!origem) {
                                alert("Defina o ponto de partida primeiro!");
                                falarTexto("Por favor, defina o ponto de partida primeiro.");
                                return;
                            }

                            calcularRota();
                        } else {
                            alert("Endereço não encontrado.");
                            falarTexto("Não encontrei esse endereço.");
                        }
                    })
                    .catch(err => console.error("Erro:", err));
            };

            recognition.onerror = function() {
                instructionsDiv.innerHTML = "Não foi possível entender. Tente novamente.";
                falarTexto("Não entendi. Tente novamente.");
            };
        });

        map.on('click', function(e) {
            const latLng = [e.latlng.lat, e.latlng.lng];

            if (!origem) {
                origem = latLng;
                if (markerOrigem) map.removeLayer(markerOrigem);
                markerOrigem = L.marker(origem, { icon: criarIconeBike() }).addTo(map).bindPopup("<b>Origem</b>").openPopup();
                instructionsDiv.innerHTML = "Origem definida! Agora defina o destino.";
            } else if (!destino) {
                destino = latLng;
                if (markerDestino) map.removeLayer(markerDestino);
                markerDestino = L.marker(destino).addTo(map).bindPopup("<b>Destino</b>").openPopup();
                instructionsDiv.innerHTML = "Calculando rota...";
                calcularRota();
            } else {
                if (markerOrigem) map.removeLayer(markerOrigem);
                if (markerDestino) map.removeLayer(markerDestino);
                if (routeLayer) map.removeLayer(routeLayer);

                origem = latLng;
                destino = null;
                markerOrigem = L.marker(origem, { icon: criarIconeBike() }).addTo(map).bindPopup("<b>Nova Origem</b>").openPopup();
                instructionsDiv.innerHTML = "Nova origem definida. Defina o destino.";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS RPM & QTH Patrulhamento</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        #header {
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        #controls {
            padding: 8px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
        }
        button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2c3e50;
        }
        #btn-voz {
            background-color: #e67e22;
        }
        #btn-voz:hover {
            background-color: #d35400;
        }
        #btn-gravar {
            background-color: #c0392b;
            min-width: 140px;
        }
        #btn-gravar.gravando {
            background-color: #7f8c8d;
            animation: pulsar 1.5s infinite;
        }
        #btn-marcar {
            background-color: #f39c12;
        }
        @keyframes pulsar {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #instructions {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
            font-size: 14px;
        }
        #map {
            width: 100%;
            height: calc(100vh - 190px);
            touch-action: none; 
        }
        .moto-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>🏍️ GPS RPM & QTH Patrulhamento</h2>
        <small style="color: #bdc3c7;">👥 Acessos: <span id="contador-visitas">1</span></small>
    </div>

    <div id="controls">
        <button id="btn-localizacao">📍 Local</button>
        <button id="btn-voz">🎤 Destino</button>
        <button id="btn-gravar">🔴 Gravar Rota</button>
        <button id="btn-marcar">⭐ Marcar Ponto</button>
    </div>
    
    <div id="instructions">Obtendo sua localização atual...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Rotate JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        // Inicializa o mapa sem coordenadas fixas; ajusta ao usuário via geolocalização.
        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: {
                position: "topright",
                behavior: "reset"
            }
        });

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let destino = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routeLayer = null;

        let isGravando = false;
        let watchId = null;
        let tempoGravacaoInterval = null;
        let segundosGravados = 0;

        let registrosTrajeto = [];
        let pontosDeMelhoria = [];
        let trackLayer = null;
        let marcadoresMelhoriaLayers = [];
        let ruaAtualNome = "Aguardando...";
        let ultimaChamadaRua = 0;

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnVoz = document.getElementById('btn-voz');
        const btnGravar = document.getElementById('btn-gravar');
        const btnMarcar = document.getElementById('btn-marcar');

        function criarIconeMoto() {
            return L.divIcon({
                className: 'moto-icon',
                html: '🏍️',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function obterNomeRuaPorCoord(lat, lon, callback) {
            const url = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${apiKey}&lang=pt`;

            fetch(url)
                .then(res => res.json())
                .then(result => {
                    let nomeFormatado = "Rua não identificada";
                    if (result.features && result.features.length > 0) {
                        const props = result.features[0].properties;
                        const rua = props.street || props.name || props.formatted || "Via sem nome";
                        const bairro = props.suburb || props.city || "";
                        nomeFormatado = bairro ? `${rua} (${bairro})` : rua;
                    }
                    if (callback) callback(nomeFormatado);
                })
                .catch(err => {
                    console.log("Erro ao buscar rua:", err);
                    if (callback) callback("Rua não identificada");
                });
        }

        async function atualizarContador() {
            try {
                const res = await fetch('https://api.counterapi.dev/v1/gps-rpm-patrulhamento/acessos/up');
                const data = await res.json();
                if (data && data.count) {
                    document.getElementById('contador-visitas').textContent = data.count;
                }
            } catch (e) {
                document.getElementById('contador-visitas').textContent = "1";
            }
        }

        function centralizarNaMinhaLocalizacao() {
            if (!navigator.geolocation) {
                alert("Geolocalização não suportada.");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                origem = [lat, lon];
                
                map.setView(origem, 16);

                obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                    ruaAtualNome = nomeRua;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Você está aqui</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>Origem:</b> ${ruaAtualNome}`;
                });
            }, (error) => {
                instructionsDiv.innerHTML = "⚠️ Ative o GPS para definir sua posição.";
                map.setView([-23.5505, -46.6333], 13);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        window.addEventListener('load', () => {
            atualizarContador();
            centralizarNaMinhaLocalizacao();
        });

        function calcularRota() {
            const routingUrl = `https://api.geoapify.com/v1/routing?waypoints=${origem[0]},${origem[1]}|${destino[0]},${destino[1]}&mode=drive&apiKey=${apiKey}`;

            fetch(routingUrl)
                .then(response => response.json())
                .then(result => {
                    if (result.features && result.features.length > 0) {
                        if (routeLayer) map.removeLayer(routeLayer);

                        routeLayer = L.geoJSON(result, {
                            style: { color: "#e67e22", weight: 6, opacity: 0.8 }
                        }).addTo(map);

                        const bounds = routeLayer.getBounds();
                        map.fitBounds(bounds, { padding: [50, 50] });

                        instructionsDiv.innerHTML = "Rota traçada para moto! Boa viagem! 🏍️";
                        falarTexto("Rota calculada com sucesso.");
                    } else {
                        alert("Não foi possível encontrar uma rota.");
                    }
                })
                .catch(error => console.log('Erro ao buscar rota:', error));
        }

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600);
            const m = Math.floor((segundos % 3600) / 60);
            const s = segundos % 60;
            
            const hStr = h > 0 ? String(h).padStart(2, '0') + ':' : '';
            const mStr = String(m).padStart(2, '0') + ':';
            const sStr = String(s).padStart(2, '0');
            
            return hStr + mStr + sStr;
        }

        btnGravar.addEventListener('click', function() {
            if (!isGravando) {
                if (!navigator.geolocation) {
                    alert("Geolocalização não suportada.");
                    return;
                }

                registrosTrajeto = [];
                pontosDeMelhoria = [];
                isGravando = true;
                segundosGravados = 0;
                
                btnGravar.classList.add('gravando');
                btnGravar.innerHTML = `⏹️ 00:00`;
                
                tempoGravacaoInterval = setInterval(() => {
                    segundosGravados++;
                    btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                }, 1000);

                instructionsDiv.innerHTML = "🔴 Iniciando rastreio detalhado...";
                falarTexto("Gravação de rota iniciada.");

                if (trackLayer) map.removeLayer(trackLayer);
                marcadoresMelhoriaLayers.forEach(m => map.removeLayer(m));
                marcadoresMelhoriaLayers = [];

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const novaCoord = [lat, lon];
                        const horaAtual = new Date().toLocaleTimeString('pt-BR');

                        map.setView(novaCoord, 16);

                        if (markerOrigem) map.removeLayer(markerOrigem);
                        markerOrigem = L.marker(novaCoord, { icon: criarIconeMoto() }).addTo(map);

                        const agora = Date.now();
                        if (agora - ultimaChamadaRua > 5000) {
                            ultimaChamadaRua = agora;
                            obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                                ruaAtualNome = nomeRua;
                                instructionsDiv.innerHTML = `🏍️ <b>${ruaAtualNome}</b> (${horaAtual})`;

                                registrosTrajeto.push({
                                    hora: horaAtual,
                                    rua: ruaAtualNome,
                                    coordenadas: novaCoord
                                });

                                atualizarLinhaTrajeto();
                            });
                        } else {
                            registrosTrajeto.push({
                                hora: horaAtual,
                                rua: ruaAtualNome,
                                coordenadas: novaCoord
                            });
                            atualizarLinhaTrajeto();
                        }
                    },
                    (error) => { console.error("Erro GPS:", error); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );

            } else {
                isGravando = false;
                navigator.geolocation.clearWatch(watchId);
                clearInterval(tempoGravacaoInterval);
                
                btnGravar.textContent = "🔴 Gravar Rota";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "✅ Gravação encerrada e arquivo gerado!";
                falarTexto("Gravação encerrada.");

                const dadosRota = {
                    dataInicio: new Date().toLocaleDateString('pt-BR'),
                    tempoTotal: formatarTempo(segundosGravados),
                    historicoRuasETempo: registrosTrajeto,
                    pontosMarcados: pontosDeMelhoria
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dadosRota, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `moto_trajeto_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            }
        });

        function atualizarLinhaTrajeto() {
            if (trackLayer) map.removeLayer(trackLayer);
            const apenasCoords = registrosTrajeto.map(item => item.coordenadas);
            trackLayer = L.polyline(apenasCoords, { color: '#c0392b', weight: 5 }).addTo(map);
        }

        btnMarcar.addEventListener('click', function() {
            if (!isGravando) {
                alert("Inicie a gravação da rota primeiro!");
                return;
            }
            if (registrosTrajeto.length === 0) {
                alert("Aguardando sinal de GPS.");
                return;
            }

            const ultimoRegistro = registrosTrajeto[registrosTrajeto.length - 1];
            const nota = prompt(`Local: ${ultimoRegistro.rua} às ${ultimoRegistro.hora}\n\nAdicionar nota (Ex: 'Radar', 'Trânsito'):`, "Ponto de atenção");

            if (nota !== null) {
                const pontoInfo = {
                    hora: ultimoRegistro.hora,
                    rua: ultimoRegistro.rua,
                    coordenadas: ultimoRegistro.coordenadas,
                    comentario: nota
                };
                pontosDeMelhoria.push(pontoInfo);

                const marcador = L.marker(ultimoRegistro.coordenadas).addTo(map)
                    .bindPopup(`<b>⭐ ${ultimoRegistro.rua}</b><br>${nota} <br><small>${ultimoRegistro.hora}</small>`)
                    .openPopup();

                marcadoresMelhoriaLayers.push(marcador);
                falarTexto("Ponto marcado.");
            }
        });

        btnLocalizacao.addEventListener('click', function() {
            centralizarNaMinhaLocalizacao();
        });

        btnVoz.addEventListener('click', function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Reconhecimento de voz não suportado.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            instructionsDiv.innerHTML = "Ouvindo destino...";
            falarTexto("Pode falar o destino.");
            recognition.start();

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                instructionsDiv.innerHTML = `Buscando: <b>${textoFalado}</b>`;
                fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(textoFalado)}&apiKey=${apiKey}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.features && data.features.length > 0) {
                            const coords = data.features[0].geometry.coordinates;
                            destino = [coords[1], coords[0]];
                            if (markerDestino) map.removeLayer(markerDestino);
                            markerDestino = L.marker(destino).addTo(map).bindPopup(`<b>Destino:</b> ${textoFalado}`).openPopup();
                            if (!origem) {
                                alert("Defina o ponto de partida primeiro!");
                                return;
                            }
                            calcularRota();
                        } else {
                            alert("Endereço não encontrado.");
                        }
                    });
            };
        });

        map.on('click', function(e) {
            if (isGravando) return;
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            const latLng = [lat, lon];

            instructionsDiv.innerHTML = "Buscando nome da rua...";

            obterNomeRuaPorCoord(lat, lon, (nomeRua) => {
                ruaAtualNome = nomeRua;

                if (!origem) {
                    origem = latLng;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Origem:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>Origem:</b> ${ruaAtualNome}`;
                } else if (!destino) {
                    destino = latLng;
                    if (markerDestino) map.removeLayer(markerDestino);
                    markerDestino = L.marker(destino).addTo(map)
                        .bindPopup(`<b>Destino:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `🏁 Calculando rota para: ${ruaAtualNome}`;
                    calcularRota();
                } else {
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    if (markerDestino) map.removeLayer(markerDestino);
                    if (routeLayer) map.removeLayer(routeLayer);
                    origem = latLng;
                    destino = null;
                    markerOrigem = L.marker(origem, { icon: criarIconeMoto() }).addTo(map)
                        .bindPopup(`<b>Nova Origem:</b><br>${ruaAtualNome}`)
                        .openPopup();
                    instructionsDiv.innerHTML = `📍 <b>Nova Origem:</b> ${ruaAtualNome}`;
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS RPM & QTH Patrulhamento</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            background-color: #2c3e50;
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        #header {
            padding: 6px 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid #34495e;
        }
        #header h2 {
            margin: 0;
            font-size: 14px;
        }
        #header small {
            font-size: 10px;
            color: #bdc3c7;
        }

        #controls {
            padding: 6px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
            align-items: center;
            flex-shrink: 0;
        }

        button, .autocomplete-container input {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            filter: brightness(0.85);
        }
        
        #btn-voz-container {
            position: relative;
            display: inline-block;
        }
        #input-destino {
            background-color: #e67e22;
            color: white;
            width: 130px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            outline: none;
            border: none;
        }
        #input-destino::placeholder {
            color: white;
            opacity: 0.9;
        }
        #sugestoes-destino {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 6px 6px;
            z-index: 2000;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            display: none;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }
        .sugestao-item {
            padding: 10px;
            font-size: 11px;
            color: #333;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            text-transform: uppercase;
        }
        .sugestao-item:hover {
            background-color: #f1f2f6;
        }

        #btn-localizacao { background-color: #34495e;}
        #btn-gravar { background-color: #c0392b;}
        #btn-gravar.gravando { background-color: #7f8c8d; animation: pulsar 1.5s infinite;}
        #btn-marcar { background-color: #f39c12;}
        #btn-relatorio { background-color: #27ae60;}
        #btn-importar { background-color: #2980b9;}
        #btn-limpar { background-color: #7f8c8d;}

        @keyframes pulsar {
            0% { opacity: 1;}
            50% { opacity: 0.5;}
            100% { opacity: 1;}
        }

        #instructions {
            padding: 6px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
            font-size: 11px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #painel-relatorio {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 50vh;
            background: #ffffff;
            border-top: 3px solid #2c3e50;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            z-index: 1500;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        .relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
        }
        .relatorio-acoes {
            display: flex;
            gap: 5px;
        }
        #btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        #btn-fechar-painel {
            background-color: #e74c3c;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        #btn-editar {
            background-color: #d35400;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        .relatorio-conteudo {
            white-space: pre-wrap;
            color: #222;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            text-transform: uppercase;
        }
        #textarea-edicao {
            width: 100%;
            height: 120px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #34495e;
            border-radius: 4px;
            resize: vertical;
        }

        #map {
            flex: 1;
            width: 100%;
            touch-action: none; 
        }
        .viatura-icon { font-size: 24px; text-align: center; line-height: 24px;}
    </style>
</head>
<body>

    <div id="app-container">
        <div id="header">
            <h2>RELATÓRIO DE SERVIÇO OPERACIONAL</h2>
            <small>ACESSOS: <span id="contador-visitas">CARREGANDO...</span></small>
        </div>

        <div id="controls">
            <button id="btn-localizacao">📍 LOCAL</button>
            
            <div id="btn-voz-container">
                <input type="text" id="input-destino" placeholder="🔍 DESTINO..." autocomplete="off">
                <div id="sugestoes-destino"></div>
            </div>

            <button id="btn-gravar">🔴 GRAVAR</button>
            <button id="btn-marcar">⭐ MARCAR</button>
            <button id="btn-relatorio">📋 RELATÓRIO</button>
            <button id="btn-importar">📂 ABRIR</button>
            <button id="btn-limpar">🧹 LIMPAR</button>
            <input type="file" id="input-json" style="display: none;" />
        </div>
        
        <div id="instructions">OBTENDO SUA LOCALIZAÇÃO ATUAL...</div>

        <div id="map"></div>
    </div>

    <div id="painel-relatorio">
        <div class="relatorio-header">
            <strong>HISTÓRICO:</strong>
            <div class="relatorio-acoes">
                <button id="btn-editar">✏️ EDITAR</button>
                <button id="btn-whatsapp">💬 WPP</button>
                <button id="btn-fechar-painel">❌</button>
            </div>
        </div>
        <div id="texto-relatorio-visivel" class="relatorio-conteudo"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: { position: "topright", behavior: "reset" }
        });

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routingLayer = null;

        let isGravando = false;
        let watchId = null;
        let tempoGravacaoInterval = null;
        let segundosGravados = 0;
        let wakeLock = null;

        const distanciaMinimaMetros = 100; 
        let ultimaCoordenadaSalva = null;
        let ultimaRuaSalva = "";

        let registrosTrajeto = [];
        let pontosDeMelhoria = [];
        let trackLayer = null;
        let marcadoresMelhoriaLayers = [];
        let ruaAtualNome = "AGUARDANDO...";
        let ultimaLat = null;
        let ultimaLon = null;
        let textoRelatorioPronto = "";
        let emModoEdicao = false;

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnGravar = document.getElementById('btn-gravar');
        const btnMarcar = document.getElementById('btn-marcar');
        const btnRelatorio = document.getElementById('btn-relatorio');
        const btnImportar = document.getElementById('btn-importar');
        const btnLimpar = document.getElementById('btn-limpar');
        const btnWhatsapp = document.getElementById('btn-whatsapp');
        const btnEditar = document.getElementById('btn-editar');
        const btnFecharPainel = document.getElementById('btn-fechar-painel');
        const inputJson = document.getElementById('input-json');
        const painelRelatorio = document.getElementById('painel-relatorio');
        const textoRelatorioVisivel = document.getElementById('texto-relatorio-visivel');
        
        const inputDestino = document.getElementById('input-destino');
        const sugestoesDestino = document.getElementById('sugestoes-destino');

        const dadosSetoresKML = [
            {
                nome: "101",
                cor: "#558B2F",
                descricao: "Rua Dom Paulo Mariano<br>Av. Imperador Pedro II",
                coordenadas: [
                    [-23.6966454, -46.5507877], [-23.6977212, -46.5511418], [-23.6984236, -46.5514153], [-23.6987134, -46.5515655], [-23.6994564, -46.551984], [-23.7000065, -46.552212], [-23.7006205, -46.5525097], [-23.7009717, -46.5526948], [-23.7013057, -46.5528637], [-23.7015022, -46.5529388], [-23.7018657, -46.5529844], [-23.7020474, -46.5529764], [-23.7022169, -46.5529388], [-23.702627, -46.5527859], [-23.7032398, -46.552499], [-23.7034584, -46.5524024], [-23.7038219, -46.5522334], [-23.7041436, -46.5521288], [-23.7043057, -46.5520993], [-23.7045562, -46.5520671], [-23.7046495, -46.5520698], [-23.704873, -46.5520993], [-23.7050866, -46.5521556], [-23.7051652, -46.5521905], [-23.7052561, -46.5518338], [-23.7053224, -46.5515012], [-23.7053985, -46.5512705], [-23.7056392, -46.5506295], [-23.7058676, -46.5501735], [-23.706015, -46.5499079], [-23.7063858, -46.5491918], [-23.7065602, -46.5488699], [-23.706791, -46.5484166], [-23.71071054, -46.5478346], [-23.707405, -46.5474108], [-23.7076604, -46.5470889], [-23.7079846, -46.5467322], [-23.7084168, -46.5463299], [-23.7087704, -46.5460107], [-23.7091978, -46.54567], [-23.70928, -46.5456017], [-23.7097528, -46.5451873], [-23.7085249, -46.5454474], [-23.7084757, -46.5454635], [-23.7084242, -46.5454608], [-23.7083922, -46.545434], [-23.70838, -46.5453831], [-23.7086256, -46.5448305], [-23.7077881, -46.5444121], [-23.7074271, -46.5442458], [-23.7073608, -46.544227], [-23.6966454, -46.5507877]
                ]
            }
        ];

        dadosSetoresKML.forEach(setor => {
            if (setor.coordenadas && setor.coordenadas.length > 0) {
                const polygon = L.polygon(setor.coordenadas, {
                    color: setor.cor,
                    weight: 2,
                    fillColor: setor.cor,
                    fillOpacity: 0.35
                }).addTo(map);

                polygon.bindPopup(`<b>SETOR: ${setor.nome}</b><br>${setor.descricao}`);
            }
        });

        function criarIconeViatura() {
            return L.divIcon({
                className: 'viatura-icon',
                html: '🚔',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        async function liberarWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isGravando) {
                await solicitarWakeLock();
            }
        });

        function emitirSomSalvamento() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Áudio bloqueado ou não suportado sem interação prévia.", e);
            }
        }

        function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function obterNomeRuaPorCoord(lat, lon, callback) {
            const url = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${apiKey}&lang=pt`;
            fetch(url)
                .then(res => res.json())
                .then(result => {
                    let nomeFormatado = "VIA NÃO IDENTIFICADA";
                    if (result.features && result.features.length > 0) {
                        const props = result.features[0].properties;
                        const rua = props.street || props.name || "VIA SEM NOME";
                        const numero = props.housenumber ? `, ${props.housenumber}` : "";
                        const bairro = props.suburb || props.city || "";
                        nomeFormatado = bairro ? `${rua}${numero} (${bairro})` : `${rua}${numero}`;
                    }
                    if (callback) callback(nomeFormatado.toUpperCase());
                })
                .catch(err => {
                    if (callback) callback("VIA NÃO IDENTIFICADA");
                });
        }

        function atualizarPainelRelatorioDinamico() {
            // Se estiver em modo de edição, não sobrescrevemos o texto atual da tela para não apagar o que o usuário digitou
            if (emModoEdicao) return;

            let relatorioFormal = `RELATÓRIO DE SERVIÇO OPERACIONAL\n`;
            relatorioFormal += `DATA: ${new Date().toLocaleDateString('pt-BR')} | TEMPO: ${isGravando ? formatarTempo(segundosGravados) : 'CONCLUÍDO'}\n\n`;
            relatorioFormal += `HISTÓRICO DE OPERAÇÕES:\n`;

            let contadorItem = 1;

            if (registrosTrajeto.length > 0) {
                registrosTrajeto.forEach((ponto) => {
                    const hora = ponto.hora || 'N/A';
                    const rua = (ponto.rua || 'N/A').toUpperCase();
                    relatorioFormal += `${contadorItem}. ÀS ${hora} - LOCAL: ${rua}.\n`;
                    contadorItem++;
                });
            }

            if (registrosTrajeto.length === 0) {
                relatorioFormal += `1. NENHUM REGISTRO INFORMADO AINDA.\n`;
            }

            if (pontosDeMelhoria.length > 0) {
                relatorioFormal += `\nALTERAÇÕES / PONTOS MARCADOS:\n`;
                pontosDeMelhoria.forEach((pm) => {
                    const hora = pm.hora || 'N/A';
                    const rua = (pm.rua || 'N/A').toUpperCase();
                    const comentario = (pm.comentario || 'OCORRÊNCIA').toUpperCase();
                    relatorioFormal += `• ÀS ${hora} ${comentario} ${rua};\n`;
                });
            }

            textoRelatorioPronto = relatorioFormal;
            textoRelatorioVisivel.textContent = relatorioFormal;
            painelRelatorio.style.display = "block";
            salvarEstadoLocal();
        }

        function calcularESobrescreverRota(destinoLat, destinoLon, enderecoFormatado) {
            if (ultimaLat === null || ultimaLon === null) {
                alert("Aguarde a obtenção da sua localização atual antes de traçar a rota.");
                return;
            }

            const urlRouting = `https://api.geoapify.com/v1/routing?waypoints=${ultimaLat},${ultimaLon}|${destinoLat},${destinoLon}&mode=drive&apiKey=${apiKey}`;

            instructionsDiv.innerHTML = `🔄 CALCULANDO ROTA...`;

            fetch(urlRouting)
                .then(res => res.json())
                .then(data => {
                    if (data.features && data.features.length > 0) {
                        const routeFeature = data.features[0];
                        
                        if (routingLayer) {
                            map.removeLayer(routingLayer);
                        }

                        routingLayer = L.geoJSON(routeFeature, {
                            style: {
                                color: '#3498db',
                                weight: 6,
                                opacity: 0.8
                            }
                        }).addTo(map);

                        map.fitBounds(routingLayer.getBounds(), { padding: [50, 50] });

                        if (markerDestino) map.removeLayer(markerDestino);
                        markerDestino = L.marker([destinoLat, destinoLon]).addTo(map)
                            .bindPopup(`<b>DESTINO:</b><br>${enderecoFormatado}`).openPopup();

                        instructionsDiv.innerHTML = `🎯 <b>ROTA:</b> ${enderecoFormatado.toUpperCase()}`;
                        falarTexto("Rota calculada com sucesso.");
                    } else {
                        alert("Não foi possível encontrar uma rota para o destino selecionado.");
                        instructionsDiv.innerHTML = `⚠️ FALHA AO CALCULAR ROTA.`;
                    }
                })
                .catch(err => {
                    console.error("Erro na API de Roteamento:", err);
                    alert("Erro de conexão ao calcular a rota.");
                });
        }

        let timeoutAutocomplete = null;
        inputDestino.addEventListener('input', function() {
            const query = this.value.trim();
            clearTimeout(timeoutAutocomplete);

            if (query.length < 3) {
                sugestoesDestino.style.display = 'none';
                sugestoesDestino.innerHTML = '';
                return;
            }

            timeoutAutocomplete = setTimeout(() => {
                let biasParam = ultimaLat && ultimaLon ? `&bias=proximity:${ultimaLon},${ultimaLat}` : '';
                const url = `https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&limit=5&lang=pt${biasParam}&apiKey=${apiKey}`;
                
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        sugestoesDestino.innerHTML = '';
                        if (data.features && data.features.length > 0) {
                            data.features.forEach(feature => {
                                const props = feature.properties;
                                const div = document.createElement('div');
                                div.className = 'sugestao-item';
                                div.textContent = props.formatted;
                                
                                div.addEventListener('click', () => {
                                    inputDestino.value = props.formatted;
                                    sugestoesDestino.style.display = 'none';
                                    
                                    const destLat = feature.geometry.coordinates[1];
                                    const destLon = feature.geometry.coordinates[0];

                                    calcularESobrescreverRota(destLat, destLon, props.formatted);
                                });

                                sugestoesDestino.appendChild(div);
                            });
                            sugestoesDestino.style.display = 'block';
                        } else {
                            sugestoesDestino.style.display = 'none';
                        }
                    })
                    .catch(err => console.error("Erro no autocompletar:", err));
            }, 300);
        });

        document.addEventListener('click', function(e) {
            if (!document.getElementById('btn-voz-container').contains(e.target)) {
                sugestoesDestino.style.display = 'none';
            }
        });

        async function atualizarContadorGlobal() {
            try {
                const res = await fetch('https://api.countapi.xyz/hit/gps-rpm-patrulhamento/visitas');
                const data = await res.json();
                if (data && typeof data.value !== 'undefined') {
                    document.getElementById('contador-visitas').textContent = data.value;
                } else {
                    throw new Error();
                }
            } catch (e) {
                let locais = parseInt(localStorage.getItem('gps_rpm_acessos_fallback') || '1');
                document.getElementById('contador-visitas').textContent = locais;
                localStorage.setItem('gps_rpm_acessos_fallback', locais + 1);
            }
        }

        function centralizarNaMinhaLocalizacao() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((position) => {
                ultimaLat = position.coords.latitude;
                ultimaLon = position.coords.longitude;
                origem = [ultimaLat, ultimaLon];
                map.setView(origem, 16);
                
                obterNomeRuaPorCoord(ultimaLat, ultimaLon, (nomeRua) => {
                    ruaAtualNome = nomeRua;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeViatura() }).addTo(map)
                        .bindPopup(`<b>LOCALIZAÇÃO ATUAL</b><br>${ruaAtualNome}`).openPopup();
                    instructionsDiv.innerHTML = `📍 <b>ORIGEM:</b> ${ruaAtualNome}`;
                });
            }, () => {
                map.setView([-23.5505, -46.6333], 13);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function salvarEstadoLocal() {
            const estado = {
                registrosTrajeto,
                pontosDeMelhoria,
                textoRelatorioPronto,
                temRelatorioVisivel: painelRelatorio.style.display === "block",
                isGravando,
                segundosGravados
            };
            localStorage.setItem('gps_rpm_estado_atual', JSON.stringify(estado));
        }

        function avaliarRegistroPorDistanciaOuEndereco() {
            if (ultimaLat === null || ultimaLon === null) return;

            const novaCoord = [ultimaLat, ultimaLon];
            const horaAtual = new Date().toLocaleTimeString('pt-BR');

            obterNomeRuaPorCoord(ultimaLat, ultimaLon, (nomeRua) => {
                ruaAtualNome = nomeRua;

                let deveSalvar = false;
                if (!isGravando) return;

                if (!ultimaCoordenadaSalva) {
                    deveSalvar = true;
                } else {
                    const distancia = calcularDistanciaMetros(
                        ultimaCoordenadaSalva[0], ultimaCoordenadaSalva[1],
                        ultimaLat, ultimaLon
                    );

                    if (distancia >= distanciaMinimaMetros && ruaAtualNome !== ultimaRuaSalva && ruaAtualNome !== "VIA NÃO IDENTIFICADA") {
                        deveSalvar = true;
                    }
                }

                if (deveSalvar) {
                    ultimaCoordenadaSalva = novaCoord;
                    ultimaRuaSalva = ruaAtualNome;

                    registrosTrajeto.push({ 
                        hora: horaAtual, 
                        rua: ruaAtualNome, 
                        coordenadas: novaCoord 
                    });
                    
                    atualizarPainelRelatorioDinamico();
                    emitirSomSalvamento();

                    if (trackLayer) map.removeLayer(trackLayer);
                    trackLayer = L.polyline(registrosTrajeto.map(i => i.coordenadas), { color: '#c0392b', weight: 5 }).addTo(map);
                    instructionsDiv.innerHTML = `📍 SALVO (${horaAtual}): <b>${ruaAtualNome}</b>`;
                }
            });
        }

        function iniciarRastreamentoGlobal() {
            if (!navigator.geolocation) return;

            watchId = navigator.geolocation.watchPosition((position) => {
                ultimaLat = position.coords.latitude;
                ultimaLon = position.coords.longitude;
                const novaCoord = [ultimaLat, ultimaLon];
                
                map.setView(novaCoord, map.getZoom());
                if (markerOrigem) map.removeLayer(markerOrigem);
                markerOrigem = L.marker(novaCoord, { icon: criarIconeViatura() }).addTo(map);

                if (isGravando) {
                    avaliarRegistroPorDistanciaOuEndereco();
                }

            }, (err) => {
                console.error("Erro de GPS no watchPosition:", err);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        function restaurarEstadoLocal() {
            const salvo = localStorage.getItem('gps_rpm_estado_atual');
            if (!salvo) return;

            try {
                const estado = JSON.parse(salvo);
                registrosTrajeto = estado.registrosTrajeto || [];
                pontosDeMelhoria = estado.pontosDeMelhoria || [];
                textoRelatorioPronto = estado.textoRelatorioPronto || "";
                isGravando = estado.isGravando || false;
                segundosGravados = estado.segundosGravados || 0;

                if (estado.temRelatorioVisivel && textoRelatorioPronto) {
                    textoRelatorioVisivel.textContent = textoRelatorioPronto;
                    painelRelatorio.style.display = "block";
                }

                const coordsValidas = registrosTrajeto.map(i => i.coordenadas).filter(c => c);
                if (coordsValidas.length > 0) {
                    trackLayer = L.polyline(coordsValidas, { color: isGravando ? '#c0392b' : '#2980b9', weight: 5 }).addTo(map);
                    map.fitBounds(trackLayer.getBounds(), { padding: [50, 50] });
                    ultimaCoordenadaSalva = coordsValidas[coordsValidas.length - 1];
                }

                pontosDeMelhoria.forEach(pm => {
                    if (pm.coordenadas) {
                        const m = L.marker(pm.coordenadas).addTo(map)
                            .bindPopup(`<b>${pm.rua}</b><br>${pm.comentario}<br><small>${pm.hora}</small>`);
                        marcadoresMelhoriaLayers.push(m);
                    }
                });

                if (isGravando) {
                    btnGravar.classList.add('gravando');
                    solicitarWakeLock();
                    tempoGravacaoInterval = setInterval(() => {
                        segundosGravados++;
                        btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                        atualizarPainelRelatorioDinamico();
                    }, 1000);
                    instructionsDiv.innerHTML = "🔴 RETOMANDO RASTREIO...";
                }
            } catch (e) {
                console.error("Erro ao recuperar estado salvo", e);
            }
        }

        window.addEventListener('load', () => {
            atualizarContadorGlobal();
            centralizarNaMinhaLocalizacao();
            restaurarEstadoLocal();
            iniciarRastreamentoGlobal();
        });

        btnImportar.addEventListener('click', function() {
            inputJson.click();
        });

        // CORREÇÃO APLICADA AQUI NO BOTÃO RELATÓRIO
        btnRelatorio.addEventListener('click', async function() {
            // Se estiver editando, força a captação do texto que está na textarea antes de gerar/baixar o relatório
            if (emModoEdicao) {
                const textarea = document.getElementById('textarea-edicao');
                if (textarea) {
                    textoRelatorioPronto = textarea.value;
                }
                emModoEdicao = false;
                btnEditar.textContent = "✏️ EDITAR";
                btnEditar.style.backgroundColor = "#d35400";
                textoRelatorioVisivel.textContent = textoRelatorioPronto;
                salvarEstadoLocal();
            } else {
                atualizarPainelRelatorioDinamico();
            }

            const dadosRelatorio = {
                dataGeracao: new Date().toLocaleDateString('pt-BR'),
                tempoTotal: isGravando ? formatarTempo(segundosGravados) : 'CONCLUÍDO',
                historicoRuasETempo: registrosTrajeto,
                pontosMarcados: pontosDeMelhoria,
                textoFormatado: textoRelatorioPronto
            };

            const jsonString = JSON.stringify(dadosRelatorio, null, 2);
            const nomeSugestao = `relatorio_operacional_${new Date().toISOString().slice(0,10)}.json`;

            if (window.showSaveFilePicker) {
                try {
                    const options = {
                        suggestedName: nomeSugestao,
                        types: [{ description: 'Arquivo JSON', accept: { 'application/json': ['.json'] } }],
                    };
                    const handle = await window.showSaveFilePicker(options);
                    const writable = await handle.createWritable();
                    await writable.write(jsonString);
                    await writable.close();
                    instructionsDiv.innerHTML = "📋 RELATÓRIO SALVO!";
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                }
            } else {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonString);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", nomeSugestao);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                instructionsDiv.innerHTML = "📋 RELATÓRIO BAIXADO!";
            }
            falarTexto("Relatório gerado.");
        });

        btnFecharPainel.addEventListener('click', function() {
            painelRelatorio.style.display = "none";
        });

        btnLimpar.addEventListener('click', function() {
            if (confirm("Deseja realmente limpar os dados atuais e iniciar um novo relatório?")) {
                if (isGravando) {
                    clearInterval(tempoGravacaoInterval);
                    liberarWakeLock();
                }
                localStorage.removeItem('gps_rpm_estado_atual');
                isGravando = false;
                registrosTrajeto = [];
                pontosDeMelhoria = [];
                ultimaCoordenadaSalva = null;
                ultimaRuaSalva = "";
                textoRelatorioPronto = "";
                emModoEdicao = false;
                btnEditar.textContent = "✏️ EDITAR";
                btnEditar.style.backgroundColor = "#d35400";
                textoRelatorioVisivel.textContent = "";
                painelRelatorio.style.display = "none";
                btnGravar.textContent = "🔴 GRAVAR";
                btnGravar.classList.remove('gravando');

                if (trackLayer) map.removeLayer(trackLayer);
                if (routingLayer) { map.removeLayer(routingLayer); routingLayer = null; }
                if (markerDestino) { map.removeLayer(markerDestino); markerDestino = null; }
                inputDestino.value = '';

                marcadoresMelhoriaLayers.forEach(m => map.removeLayer(m));
                marcadoresMelhoriaLayers = [];

                instructionsDiv.innerHTML = "🧹 PRONTO PARA NOVO REGISTRO.";
                falarTexto("Dados limpos.");
            }
        });

        inputJson.addEventListener('change', function(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    const historico = dados.historicoRuasETempo || dados.historico || dados.pontos || [];
                    const pontosAtencao = dados.pontosMarcados || dados.pontosDeMelhoria || [];

                    registrosTrajeto = historico;
                    pontosDeMelhoria = pontosAtencao;

                    emModoEdicao = false;
                    btnEditar.textContent = "✏️ EDITAR";
                    btnEditar.style.backgroundColor = "#d35400";
                    
                    if (dados.textoFormatado) {
                        textoRelatorioPronto = dados.textoFormatado;
                        textoRelatorioVisivel.textContent = textoRelatorioPronto;
                        painelRelatorio.style.display = "block";
                    } else {
                        atualizarPainelRelatorioDinamico();
                    }

                    instructionsDiv.innerHTML = `📂 CARREGADO COM SUCESSO.`;
                    falarTexto("Relatório carregado.");

                    if (trackLayer) map.removeLayer(trackLayer);
                    marcadoresMelhoriaLayers.forEach(m => map.removeLayer(m));
                    marcadoresMelhoriaLayers = [];

                    const coordsValidas = [];
                    historico.forEach(item => {
                        if (item.coordenadas && Array.isArray(item.coordenadas)) {
                            coordsValidas.push(item.coordenadas);
                        }
                    });

                    if (coordsValidas.length > 0) {
                        trackLayer = L.polyline(coordsValidas, { color: '#2980b9', weight: 5 }).addTo(map);
                        map.fitBounds(trackLayer.getBounds(), { padding: [50, 50] });
                    }

                    pontosAtencao.forEach(pm => {
                        if (pm.coordenadas) {
                            const m = L.marker(pm.coordenadas).addTo(map)
                                .bindPopup(`<b>${pm.rua}</b><br>${pm.comentario}<br><small>${pm.hora}</small>`);
                            marcadoresMelhoriaLayers.push(m);
                        }
                    });

                } catch (err) {
                    alert("ERRO AO LER O ARQUIVO JSON.");
                    console.error(err);
                } finally {
                    inputJson.value = '';
                }
            };
            leitor.readAsText(arquivo);
        });

        btnEditar.addEventListener('click', function() {
            if (!emModoEdicao) {
                emModoEdicao = true;
                btnEditar.textContent = "💾 SALVAR";
                btnEditar.style.backgroundColor = "#27ae60";
                textoRelatorioVisivel.innerHTML = `<textarea id="textarea-edicao">${textoRelatorioPronto}</textarea>`;
            } else {
                const novoTexto = document.getElementById('textarea-edicao').value;
                textoRelatorioPronto = novoTexto;
                emModoEdicao = false;
                btnEditar.textContent = "✏️ EDITAR";
                btnEditar.style.backgroundColor = "#d35400";
                textoRelatorioVisivel.textContent = textoRelatorioPronto;
                salvarEstadoLocal();
                falarTexto("Alterações salvas.");
            }
        });

        btnWhatsapp.addEventListener('click', function() {
            if (emModoEdicao) {
                const novoTexto = document.getElementById('textarea-edicao').value;
                textoRelatorioPronto = novoTexto;
                emModoEdicao = false;
                btnEditar.textContent = "✏️ EDITAR";
                btnEditar.style.backgroundColor = "#d35400";
                textoRelatorioVisivel.textContent = textoRelatorioPronto;
                salvarEstadoLocal();
            }

            if (!textoRelatorioPronto) return;
            const urlWpp = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoRelatorioPronto)}`;
            window.open(urlWpp, '_blank');
        });

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600);
            const m = Math.floor((segundos % 3600) / 60);
            const s = segundos % 60;
            return (h > 0 ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        btnGravar.addEventListener('click', async function() {
            if (!isGravando) {
                if (!navigator.geolocation) { alert("GPS NÃO SUPORTADO."); return; }

                isGravando = true;
                segundosGravados = 0;

                if (ultimaLat !== null && ultimaLon !== null) {
                    avaliarRegistroPorDistanciaOuEndereco();
                }

                btnGravar.classList.add('gravando');
                solicitarWakeLock();
                
                tempoGravacaoInterval = setInterval(() => {
                    segundosGravados++;
                    btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                    atualizarPainelRelatorioDinamico();
                }, 1000);

                falarTexto("Gravação iniciada.");

                if (trackLayer) map.removeLayer(trackLayer);
                marcadoresMelhoriaLayers.forEach(m => map.removeLayer(m));
                marcadoresMelhoriaLayers = [];

            } else {
                isGravando = false;
                clearInterval(tempoGravacaoInterval);
                liberarWakeLock();
                
                btnGravar.textContent = "🔴 GRAVAR";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "✅ GRAVAÇÃO ENCERRADA!";
                falarTexto("Gravação encerrada.");

                atualizarPainelRelatorioDinamico();

                const dadosRota = {
                    dataInicio: new Date().toLocaleDateString('pt-BR'),
                    tempoTotal: formatarTempo(segundosGravados),
                    historicoRuasETempo: registrosTrajeto,
                    pontosMarcados: pontosDeMelhoria,
                    textoFormatado: textoRelatorioPronto
                };

                const jsonString = JSON.stringify(dadosRota, null, 2);
                const nomeSugestao = `viatura_trajeto_${new Date().toISOString().slice(0,10)}.json`;

                if (window.showSaveFilePicker) {
                    try {
                        const options = {
                            suggestedName: nomeSugestao,
                            types: [{ description: 'Arquivo JSON', accept: { 'application/json': ['.json'] } }],
                        };
                        const handle = await window.showSaveFilePicker(options);
                        const writable = await handle.createWritable();
                        await writable.write(jsonString);
                        await writable.close();
                    } catch (err) {
                        if (err.name !== 'AbortError') console.error(err);
                    }
                } else {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonString);
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", nomeSugestao);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                }

                localStorage.removeItem('gps_rpm_estado_atual');
            }
        });

        btnMarcar.addEventListener('click', function() {
            if (ultimaLat === null || ultimaLon === null) { 
                alert("AGUARDANDO SINAL DE GPS ATUAL."); 
                return; 
            }

            const horaAtual = new Date().toLocaleTimeString('pt-BR');
            
            obterNomeRuaPorCoord(ultimaLat, ultimaLon, (ruaEncontrada) => {
                const nota = prompt(`LOCAL: ${ruaEncontrada} ÀS ${horaAtual}\n\nDESCRIÇÃO DA OCORRÊNCIA:`, "ABORDAGEM REALIZADA");
                if (nota !== null) {
                    const notaUpper = nota.toUpperCase();
                    const coordsAtuais = [ultimaLat, ultimaLon];

                    pontosDeMelhoria.push({ 
                        hora: horaAtual, 
                        rua: ruaEncontrada, 
                        coordenadas: coordsAtuais, 
                        comentario: notaUpper 
                    });

                    atualizarPainelRelatorioDinamico();

                    const m = L.marker(coordsAtuais).addTo(map).bindPopup(`<b>${ruaEncontrada}</b><br>${notaUpper}`).openPopup();
                    marcadoresMelhoriaLayers.push(m);
                    falarTexto("Ponto marcado.");
                }
            });
        });

        btnLocalizacao.addEventListener('click', centralizarNaMinhaLocalizacao);
    </script>
</body>
</html>

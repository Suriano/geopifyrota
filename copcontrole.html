
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Câmeras Corporais Portáteis</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ícones FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="bg-slate-900 text-white p-6 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
          <i class="fa-solid.fa-video text-blue-400"></i>
          Controle de Câmeras Corporais Portáteis
        </h1>
        <p class="text-slate-400 text-sm mt-1">Gerenciamento de cautela, retirada e devolução de equipamentos</p>
      </div>
      <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
        <i class="fa-solid fa-clock text-blue-400"></i>
        <span id="relogio" class="font-mono text-sm">--:--:--</span>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Formulário de Registro -->
      <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b flex items-center gap-2">
          <i class="fa-solid fa-clipboard-user text-blue-600"></i>
          Nova Retirada de Câmera
        </h2>
        
        <form id="formCamera" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Graduação</label>
            <input type="text" id="graduacao" required placeholder="Ex: Sd, Cb, Sgt, Sub..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">RE (Registro / Matrícula)</label>
            <input type="text" id="re" required placeholder="Ex: 123456-7" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Usuário / Policial</label>
            <input type="text" id="usuario" required placeholder="Ex: Fulano de Tal" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Número da Câmera (ID/Patrimônio)</label>
            <input type="text" id="numCamera" required placeholder="Ex: CAM-042" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Data / Hora da Retirada</label>
            <input type="datetime-local" id="dataRetirada" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-check"></i>
            Registrar Retirada
          </button>
        </form>
      </div>

      <!-- Tabela de Registros -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 pb-2 border-b">
          <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-600"></i>
            Histórico e Cautelas Ativas
          </h2>
          
          <div class="relative w-full sm:w-64">
            <input type="text" id="filtroPesquisa" placeholder="Buscar por RE, Usuário ou Câmera..." class="w-full pl-9 pr-4 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          </div>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                <th class="py-3 px-3">Grad. / RE</th>
                <th class="py-3 px-3">Usuário</th>
                <th class="py-3 px-3">Nº Câmera</th>
                <th class="py-3 px-3">Status</th>
                <th class="py-3 px-3">Retirada</th>
                <th class="py-3 px-3">Devolução</th>
                <th class="py-3 px-3 text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaCorpo" class="divide-y divide-slate-100 text-sm">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Rodapé da tabela com contador -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
          <span id="contadorRegistros">Total de registros: 0</span>
          <button onclick="limparHistorico()" class="text-red-600 hover:text-red-800 font-medium">Limpar histórico</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Atualizar relógio em tempo real
    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById('relogio').textContent = agora.toLocaleTimeString('pt-BR');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // Definir data/hora atual no input de retirada por padrão
    function definirDataHoraAtualInput() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('dataRetirada').value = now.toISOString().slice(0, 16);
    }
    definirDataHoraAtualInput();

    // Gerenciamento de Dados (LocalStorage)
    let registros = JSON.parse(localStorage.getItem('controle_cameras')) || [];

    const form = document.getElementById('formCamera');
    const tabelaCorpo = document.getElementById('tabelaCorpo');
    const filtroPesquisa = document.getElementById('filtroPesquisa');

    function formatarDataIsoParaPtBr(dataIso) {
      if (!dataIso) return '-';
      const data = new Date(dataIso);
      return data.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function salvarEcerar() {
      localStorage.setItem('controle_cameras', JSON.stringify(registros));
      renderizarTabela();
    }

    function renderizarTabela() {
      const termo = filtroPesquisa.value.toLowerCase();
      tabelaCorpo.innerHTML = '';

      const filtrados = registros.filter(item => 
        item.usuario.toLowerCase().includes(termo) ||
        item.re.toLowerCase().includes(termo) ||
        item.numCamera.toLowerCase().includes(termo) ||
        item.graduacao.toLowerCase().includes(termo)
      );

      if (filtrados.length === 0) {
        tabelaCorpo.innerHTML = `
          <tr>
            <td colspan="7" class="py-8 text-center text-slate-400">Nenhum registro encontrado.</td>
          </tr>
        `;
        document.getElementById('contadorRegistros').textContent = `Total exibido: 0`;
        return;
      }

      filtrados.forEach((item) => {
        const isDevolvido = item.status === 'DEVOLVIDO';
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';

        tr.innerHTML = `
          <td class="py-3 px-3">
            <span class="font-semibold text-slate-800">${item.graduacao}</span>
            <div class="text-xs text-slate-500">RE: ${item.re}</div>
          </td>
          <td class="py-3 px-3 font-medium text-slate-800">${item.usuario}</td>
          <td class="py-3 px-3">
            <span class="bg-slate-200 text-slate-800 font-mono text-xs px-2.5 py-1 rounded-md font-semibold">${item.numCamera}</span>
          </td>
          <td class="py-3 px-3">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold ${
              isDevolvido 
                ? 'bg-emerald-100 text-emerald-800' 
                : 'bg-amber-100 text-amber-800'
            }">
              <span class="w-1.5 h-1.5 rounded-full ${isDevolvido ? 'bg-emerald-500' : 'bg-amber-500 animate-pulse'}"></span>
              ${item.status}
            </span>
          </td>
          <td class="py-3 px-3 text-xs text-slate-600">${formatarDataIsoParaPtBr(item.dataRetirada)}</td>
          <td class="py-3 px-3 text-xs text-slate-600">${formatarDataIsoParaPtBr(item.dataDevolucao)}</td>
          <td class="py-3 px-3 text-center">
            ${!isDevolvido ? `
              <button onclick="registrarDevolucao('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-md transition shadow-xs flex items-center gap-1 mx-auto" title="Marcar como devolvido">
                <i class="fa-solid fa-rotate-left"></i> Devolver
              </button>
            ` : `
              <button onclick="excluirRegistro('${item.id}')" class="text-slate-400 hover:text-red-600 transition p-1" title="Excluir registro">
                <i class="fa-solid.fa-trash"></i>
              </button>
            `}
          </td>
        `;
        tabelaCorpo.appendChild(tr);
      });

      document.getElementById('contadorRegistros').textContent = `Total de registros: ${registros.length}`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const novoRegistro = {
        id: Date.now().toString(),
        graduacao: document.getElementById('graduacao').value.trim(),
        re: document.getElementById('re').value.trim(),
        usuario: document.getElementById('usuario').value.trim(),
        numCamera: document.getElementById('numCamera').value.trim(),
        status: 'EM USO',
        dataRetirada: document.getElementById('dataRetirada').value,
        dataDevolucao: null
      };

      registros.unshift(novoRegistro);
      salvarEcerar();

      // Limpa campos específicos e re-sincroniza data atual
      document.getElementById('usuario').value = '';
      document.getElementById('numCamera').value = '';
      definirDataHoraAtualInput();
    });

    window.registrarDevolucao = function(id) {
      const index = registros.findIndex(r => r.id === id);
      if (index !== -1) {
        registros[index].status = 'DEVOLVIDO';
        registros[index].dataDevolucao = new Date().toISOString();
        salvarEcerar();
      }
    };

    window.excluirRegistro = function(id) {
      if (confirm('Deseja realmente excluir este registro?')) {
        registros = registros.filter(r => r.id !== id);
        salvarEcerar();
      }
    };

    window.limparHistorico = function() {
      if (confirm('Tem certeza que deseja apagar todo o histórico de cautelas?')) {
        registros = [];
        salvarEcerar();
      }
    };

    filtroPesquisa.addEventListener('input', renderizarTabela);

    // Renderiza inicialmente
    renderizarTabela();
  </script>
</body>
</html>

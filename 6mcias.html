<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Setores - Painel Operacional</title>

    <!-- 1. Importa o CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Estilos gerais da página */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Painel de Controle / Filtros Moderno (Estilo Card Flutuante) */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 280px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #control-panel.hidden {
            transform: translateX(120%);
            opacity: 0;
            pointer-events: none;
        }

        /* Botão para reabrir o painel quando ele estiver oculto */
        #btn-show-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: 600;
            color: #1a73e8;
            cursor: pointer;
            display: none;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        #btn-show-panel:hover {
            background: #e8f0fe;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        #control-panel h2 {
            font-size: 16px;
            margin: 0;
            color: #1a73e8;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
            padding: 0 4px;
            border-radius: 4px;
        }

        .btn-close:hover {
            background: #eee;
            color: #000;
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .layer-toggle input {
            margin-right: 8px;
            accent-color: #1a73e8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-action {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
            text-align: center;
        }

        .btn-action:hover {
            background-color: #1557b0;
        }

        .btn-location {
            background-color: #34a853;
        }

        .btn-location:hover {
            background-color: #2e8b44;
        }

        /* Estilização personalizada dos Popups do Leaflet */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content {
            margin: 14px 18px;
            line-height: 1.5;
        }
        .leaflet-popup-content b {
            color: #1a73e8;
            font-size: 14px;
        }
        /* Estilo para o marcador de texto (caso use emoji) */
        .policial-marker-label {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 24px;
            text-align: center;
            margin-top: -12px !important;
            margin-left: -12px !important;
        }
    </style>
</head>
<body>

    <!-- Botão flutuante para reabrir o painel -->
    <button id="btn-show-panel" onclick="alternarPainel()">🗺️ Painel</button>

    <!-- Painel Lateral Flutuante para Filtros -->
    <div id="control-panel">
        <div class="panel-header">
            <h2>🗺️ Painel Operacional</h2>
            <button class="btn-close" onclick="alternarPainel()" title="Ocultar painel">✕</button>
        </div>
        <div id="filters-container">
            <!-- Os checkboxes das camadas serão injetados dinamicamente aqui -->
        </div>
        <button class="btn-action btn-location" onclick="encontrarLocalizacao()">📍 Minha Posição </button>
        <button class="btn-action" onclick="resetarZoom()">Centralizar Setores</button>
    </div>

    <!-- Elemento do Mapa -->
    <div id="map"></div>

    <!-- 2. Importa o JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializa o mapa
        var map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Função para alternar visibilidade do painel
        function alternarPainel() {
            var panel = document.getElementById('control-panel');
            var btnShow = document.getElementById('btn-show-panel');
            
            panel.classList.toggle('hidden');
            
            if (panel.classList.contains('hidden')) {
                btnShow.style.display = 'block';
            } else {
                btnShow.style.display = 'none';
            }
        }

        // --- CONFIGURAÇÃO DO ÍCONE PERSONALIZADO DO POLICIAL ---
        var iconePolicialEmoji = L.divIcon({
            className: 'policial-marker-label',
            html: '👮‍♂️',
            iconSize: [24, 24],
            iconAnchor: [12, 24],
            popupAnchor: [0, -20]
        });

        var meuIconeFinal = iconePolicialEmoji; 

        function styleFeature(feature) {
            var corSetor = (feature.properties && feature.properties.fill) ? feature.properties.fill : '#3388ff';
            var opacidadePreenchimento = (feature.properties && feature.properties['fill-opacity'] !== undefined) 
                ? feature.properties['fill-opacity'] 
                : 0.45;
            return { color: corSetor, weight: 2.5, fillColor: corSetor, fillOpacity: opacidadePreenchimento };
        }

        function onEachFeature(feature, layer) {
            if (feature.properties) {
                let nome = feature.properties.name || feature.properties.Name || 'Setor';
                let descricao = feature.properties.description || '';
                if (typeof descricao === 'object' && descricao.value) descricao = descricao.value;
                let conteudoPopup = `<b>${nome}</b>`;
                if (descricao && typeof descricao === 'string' && descricao.trim() !== '') 
                    conteudoPopup += `<br><span style="color: #555;">${descricao}</span>`;
                layer.bindPopup(conteudoPopup);
                layer.on({
                    mouseover: function(e) { e.target.setStyle({ weight: 4, fillOpacity: 0.7 }); },
                    mouseout: function(e) { e.target.setStyle(styleFeature(e.target.feature)); }
                });
            }
        }

        var groupLayer = new L.FeatureGroup();
        var markerLocalizacao = null; 
        var circleLocalizacao = null; 

        var fontesGeoJson = [
          { nome: "Setores 1ª Cia 6⁰BPM/M", url: 'https://raw.githubusercontent.com/Suriano/geopifyrota/refs/heads/main/Untitled%20(2).json' },
          { nome: "Setores 3ª Cia 6⁰BPM/M", url: 'https://raw.githubusercontent.com/Suriano/geopifyrota/refs/heads/main/Untitled%20(1).json' }   
        ];

        function carregarArquivo(fonte, index) {
            return fetch(fonte.url)
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao baixar: ' + fonte.url);
                    return response.json();
                })
                .then(data => {
                    var camadaGeoJson = L.geoJSON(data, { style: styleFeature, onEachFeature: onEachFeature });
                    camadaGeoJson.addTo(map);
                    groupLayer.addLayer(camadaGeoJson);
                    criarCheckboxFiltro(fonte.nome, index, camadaGeoJson);
                }).catch(error => console.error("Erro ao carregar " + fonte.nome + ":", error));
        }

        function criarCheckboxFiltro(nomeCamada, index, layerRef) {
            var container = document.getElementById('filters-container');
            var label = document.createElement('label'); label.className = 'layer-toggle';
            var checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = true; checkbox.id = 'chk-' + index;
            checkbox.addEventListener('change', function() {
                if (this.checked) map.addLayer(layerRef); else map.removeLayer(layerRef);
            });
            var span = document.createElement('span'); span.innerText = nomeCamada;
            label.appendChild(checkbox); label.appendChild(span); container.appendChild(label);
        }

        function resetarZoom() {
            if (groupLayer.getLayers().length > 0) map.fitBounds(groupLayer.getBounds(), { padding: [50, 50] });
        }

        function encontrarLocalizacao() {
            map.locate({setView: true, maxZoom: 16, watch: false});
        }

        map.on('locationfound', function(e) {
            var radius = e.accuracy;

            if (markerLocalizacao) {
                map.removeLayer(markerLocalizacao);
                map.removeLayer(circleLocalizacao);
            }

            markerLocalizacao = L.marker(e.latlng, {
                icon: meuIconeFinal 
            }).addTo(map)
              .bindPopup("<b>Patrulheiro</b><br>Precisão: " + Math.round(radius) + " metros.").openPopup();

            circleLocalizacao = L.circle(e.latlng, radius, {
                color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
            }).addTo(map);
        });

        map.on('locationerror', function(e) {
            alert("Não foi possível obter sua localização. Verifique se o GPS está ativado e se permitiu o acesso no navegador.");
        });

        Promise.all(fontesGeoJson.map((fonte, idx) => carregarArquivo(fonte, idx)))
            .then(() => resetarZoom());

    </script>
</body>
</html>

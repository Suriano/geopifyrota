<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Setores 1ª Cia - 6º BPM/M</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 600px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicializa o mapa centralizado em São Bernardo do Campo (região aproximada)
        var map = L.map('map').setView([-23.705, -46.545], 14);

        // 2. Adiciona camada de mapa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Função para estilizar os polígonos dos setores com base nas propriedades do KML/GeoJSON
        function styleFeature(feature) {
            return {
                color: '#3388ff',       // Cor da borda
                weight: 1.2,
                fillColor: '#3388ff',   // Cor de preenchimento (pode adaptar com base nas cores do KML)
                fillOpacity: 0.3        // Transparência estilo KML (77 hex / ~30%)
            };
        }

        // 4. Função para exibir o nome do setor/ponto ao clicar
        function onEachFeature(feature, layer) {
            if (feature.properties && feature.properties.name) {
                let popupContent = `<b>${feature.properties.name}</b>`;
                if (feature.properties.description) {
                    popupContent += `<br>${feature.properties.description}`;
                }
                layer.bindPopup(popupContent);
            }
        }

        // 5. Carrega o arquivo GeoJSON para o Leaflet
        fetch('setores.geojson')
            .then(response => response.json())
            .then(data => {
                var setoresLayer = L.geoJSON(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);

                // Ajusta o zoom do mapa automaticamente para os limites dos setores
                map.fitBounds(setoresLayer.getBounds());
            })
            .catch(error => console.error('Erro ao carregar o GeoJSON:', error));
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mapa KML - Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 600px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Importa o plugin para leitura de KML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-kml/1.0.1/L.KML.min.js"></script>
    
    <script>
        var map = L.map('map').setView([-23.705, -46.545], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Carrega o arquivo KML via AJAX/Fetch
        fetch('Setores 1ª Cia - 6º BPM-M.kml')
            .then(res => res.text())
            .then(kmlText => {
                const parser = new DOMParser();
                const kmlDom = parser.parseFromString(kmlText, 'text/xml');
                const kmlLayer = new L.KML(kmlDom);
                
                map.addLayer(kmlLayer);
                
                // Ajusta o zoom para a camada carregada
                map.fitBounds(kmlLayer.getBounds());
            });
    </script>
</body>
</html>

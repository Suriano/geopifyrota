<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS RPM & QTH Patrulhamento</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.css" />

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            background-color: #2c3e50;
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        #header {
            padding: 6px 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid #34495e;
        }
        #header h2 {
            margin: 0;
            font-size: 14px;
        }
        #header small {
            font-size: 10px;
            color: #bdc3c7;
        }

        #controls {
            padding: 6px;
            background-color: #f1f2f6;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dcdde1;
            align-items: center;
            flex-shrink: 0;
        }

        button, .autocomplete-container input {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            filter: brightness(0.85);
        }
        
        #btn-voz-container {
            position: relative;
            display: inline-block;
        }
        #input-destino {
            background-color: #e67e22;
            color: white;
            width: 130px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            outline: none;
            border: none;
        }
        #input-destino::placeholder {
            color: white;
            opacity: 0.9;
        }

        #btn-localizacao { background-color: #34495e; }
        #btn-gravar { background-color: #c0392b; }
        #btn-gravar.gravando { background-color: #7f8c8d; animation: pulsar 1.5s infinite; }
        #btn-audio { background-color: #8e44ad; }
        #btn-audio.gravando-audio { background-color: #e74c3c; animation: pulsar 1.5s infinite; }
        #btn-transcrever { background-color: #d35400; }
        #btn-transcrever.ouvindo { background-color: #e67e22; animation: pulsar 1.5s infinite; }
        #btn-marcar { background-color: #f39c12; }
        #btn-importar { background-color: #2980b9; }
        #btn-limpar { background-color: #7f8c8d; }

        @keyframes pulsar {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #instructions {
            padding: 6px;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
            font-size: 11px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #modal-marcar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-conteudo {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .modal-conteudo h3 {
            margin-top: 0;
            font-size: 13px;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        .atalhos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn-atalho {
            background-color: #34495e;
            color: white;
            font-size: 10px;
            padding: 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .btn-atalho:active {
            background-color: #2c3e50;
        }
        
        .textarea-container {
            position: relative;
            width: 100%;
        }
        #textarea-ocorrencia {
            width: 100%;
            height: 80px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            margin-bottom: 10px;
        }
        #btn-ditado-modal {
            position: absolute;
            right: 5px;
            top: 5px;
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-acoes {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }
        #btn-modal-ok {
            background-color: #27ae60;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
        }
        #btn-modal-cancelar {
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
        }

        #modal-gerar-relatorio {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 3500;
            justify-content: center;
            align-items: center;
        }
        #textarea-relatorio-modal {
            width: 100%;
            height: 180px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #34495e;
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 10px;
        }

        #painel-relatorio {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 50vh;
            background: #ffffff;
            border-top: 3px solid #2c3e50;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            z-index: 1500;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        .relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
        }
        .relatorio-acoes {
            display: flex;
            gap: 5px;
        }
        #btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        #btn-fechar-painel {
            background-color: #e74c3c;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        #btn-gerar-relatorio-modal {
            background-color: #27ae60;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
        }
        .relatorio-conteudo {
            white-space: pre-wrap;
            color: #222;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            text-transform: uppercase;
        }
        
        .lista-audios {
            margin-top: 10px;
            border-top: 1px dashed #ccc;
            padding-top: 8px;
        }
        .audio-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
            background: #f1f2f6;
            padding: 5px;
            border-radius: 4px;
        }
        .audio-item audio {
            height: 30px;
            width: 180px;
        }

        #map {
            flex: 1;
            width: 100%;
            touch-action: none; 
        }
        .viatura-icon { font-size: 24px; text-align: center; line-height: 24px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="header">
            <h2>RELATÓRIO DE SERVIÇO OPERACIONAL</h2>
            <small>ACESSOS: <span id="contador-visitas">CARREGANDO...</span></small>
        </div>

        <div id="controls">
            <button id="btn-localizacao">📍 LOCAL</button>
            
            <div id="btn-voz-container">
                <input type="text" id="input-destino" placeholder="🔍 DESTINO..." autocomplete="off">
            </div>

            <button id="btn-gravar">🔴 GRAVAR</button>
            <button id="btn-audio">🎙️ ÁUDIO</button>
            <button id="btn-transcrever">🗣️ FALA (TEXTO)</button>
            <button id="btn-marcar">⭐ MARCAR</button>
            <button id="btn-importar">📂 ABRIR</button>
            <button id="btn-limpar">🧹 LIMPAR</button>
            <input type="file" id="input-json" style="display: none;" />
        </div>
        
        <div id="instructions">OBTENDO SUA LOCALIZAÇÃO ATUAL...</div>

        <div id="map"></div>
    </div>

    <!-- Modal Personalizado de Marcação -->
    <div id="modal-marcar">
        <div class="modal-conteudo">
            <h3 id="modal-titulo-local">MARCAR OCORRÊNCIA</h3>
            <div class="atalhos-grid">
                <button type="button" class="btn-atalho" onclick="inserirAtalho('ABORDAGEM REALIZADA')">ABORDAGEM REALIZADA</button>
                <button type="button" class="btn-atalho" onclick="inserirAtalho('PATRULHAMENTO')">PATRULHAMENTO</button>
                <button type="button" class="btn-atalho" onclick="inserirAtalho('ATENDIMENTO DO TALÃO')">ATENDIMENTO DO TALÃO</button>
                <button type="button" class="btn-atalho" onclick="inserirAtalho('RONDA')">RONDA</button>
            </div>
            <div class="textarea-container">
                <textarea id="textarea-ocorrencia" placeholder="DIGITE OU FALE..."></textarea>
                <button type="button" id="btn-ditado-modal" title="Falar no campo">🎙️ Falar</button>
            </div>
            <div class="modal-acoes">
                <button type="button" id="btn-modal-cancelar">CANCELAR</button>
                <button type="button" id="btn-modal-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal para Gerar, Editar e Salvar Relatório -->
    <div id="modal-gerar-relatorio">
        <div class="modal-conteudo" style="max-width: 450px;">
            <h3>EDITAR / GERAR RELATÓRIO</h3>
            <textarea id="textarea-relatorio-modal"></textarea>
            <div class="modal-acoes">
                <button type="button" id="btn-modal-relatorio-cancelar" style="background-color: #7f8c8d; color: white; padding: 6px 12px; border-radius: 4px;">FECHAR</button>
                <button type="button" id="btn-modal-relatorio-salvar" style="background-color: #27ae60; color: white; padding: 6px 12px; border-radius: 4px;">💾 SALVAR E BAIXAR</button>
            </div>
        </div>
    </div>

    <!-- Painel Formal de Exibição (Flutuante na parte inferior) -->
    <div id="painel-relatorio">
        <div class="relatorio-header">
            <strong>HISTÓRICO:</strong>
            <div class="relatorio-acoes">
                <button id="btn-gerar-relatorio-modal">✏️ EDITAR / GERAR</button>
                <button id="btn-whatsapp">💬 WPP</button>
                <button id="btn-fechar-painel">❌</button>
            </div>
        </div>
        <div id="texto-relatorio-visivel" class="relatorio-conteudo"></div>
        <div id="container-audios-salvos" class="lista-audios" style="display:none;">
            <strong>ÁUDIOS GRAVADOS:</strong>
            <div id="lista-audios-elementos"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>

    <script>
        const apiKey = "daca396975f54c2d95e7c4c7d25e86ec";

        const map = L.map('map', {
            rotate: true,
            touchRotate: true,
            rotateControl: { position: "topright", behavior: "reset" }
        });

        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
            attribution: 'Powered by Geoapify | © OpenStreetMap contributors',
            maxZoom: 20,
            id: 'osm-carto'
        }).addTo(map);

        let origem = null;
        let markerOrigem = null;
        let markerDestino = null;
        let routingLayer = null;

        let isGravando = false;
        let watchId = null;
        let tempoGravacaoInterval = null;
        let segundosGravados = 0;
        let wakeLock = null;

        // Variáveis para gravação de áudio padrão (MediaRecorder)
        let mediaRecorder = null;
        let audioChunks = [];
        let isGravandoAudio = false;
        let audiosGravados = [];

        // Variáveis para reconhecimento de fala / transcrição em texto
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isTranscrevendo = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;
        }

        const distanciaMinimaMetros = 100; 
        let ultimaCoordenadaSalva = null;
        let ultimaRuaSalva = "";

        let registrosTrajeto = [];
        let pontosDeMelhoria = [];
        let trackLayer = null;
        let marcadoresMelhoriaLayers = [];
        let ruaAtualNome = "AGUARDANDO...";
        let ultimaLat = null;
        let ultimaLon = null;
        let textoRelatorioPronto = "";

        const instructionsDiv = document.getElementById('instructions');
        const btnLocalizacao = document.getElementById('btn-localizacao');
        const btnGravar = document.getElementById('btn-gravar');
        const btnAudio = document.getElementById('btn-audio');
        const btnTranscrever = document.getElementById('btn-transcrever');
        const btnMarcar = document.getElementById('btn-marcar');
        const btnImportar = document.getElementById('btn-importar');
        const btnLimpar = document.getElementById('btn-limpar');
        const btnWhatsapp = document.getElementById('btn-whatsapp');
        const btnGerarRelatorioModal = document.getElementById('btn-gerar-relatorio-modal');
        const btnFecharPainel = document.getElementById('btn-fechar-painel');
        const inputJson = document.getElementById('input-json');
        const painelRelatorio = document.getElementById('painel-relatorio');
        const textoRelatorioVisivel = document.getElementById('texto-relatorio-visivel');
        const containerAudiosSalvos = document.getElementById('container-audios-salvos');
        const listaAudiosElementos = document.getElementById('lista-audios-elementos');
        
        const inputDestino = document.getElementById('input-destino');

        const modalMarcar = document.getElementById('modal-marcar');
        const modalTituloLocal = document.getElementById('modal-titulo-local');
        const textareaOcorrencia = document.getElementById('textarea-ocorrencia');
        const btnDitadoModal = document.getElementById('btn-ditado-modal');
        const btnModalOk = document.getElementById('btn-modal-ok');
        const btnModalCancelar = document.getElementById('btn-modal-cancelar');

        const modalGerarRelatorio = document.getElementById('modal-gerar-relatorio');
        const textareaRelatorioModal = document.getElementById('textarea-relatorio-modal');
        const btnModalRelatorioSalvar = document.getElementById('btn-modal-relatorio-salvar');
        const btnModalRelatorioCancelar = document.getElementById('btn-modal-relatorio-cancelar');

        function inserirAtalho(texto) {
            const atual = textareaOcorrencia.value.trim();
            if (atual) {
                textareaOcorrencia.value = atual + " - " + texto;
            } else {
                textareaOcorrencia.value = texto;
            }
            textareaOcorrencia.focus();
        }

        const dadosSetoresKML = [
            {
                nome: "101",
                cor: "#558B2F",
                descricao: "Rua Dom Paulo Mariano<br>Av. Imperador Pedro II",
                coordenadas: [
                    [-23.6966454, -46.5507877], [-23.6977212, -46.5511418], [-23.6984236, -46.5514153], [-23.6987134, -46.5515655], [-23.6994564, -46.551984], [-23.7000065, -46.552212], [-23.7006205, -46.5525097], [-23.7009717, -46.5526948], [-23.7013057, -46.5528637], [-23.7015022, -46.5529388], [-23.7018657, -46.5529844], [-23.7020474, -46.5529764], [-23.7022169, -46.5529388], [-23.702627, -46.5527859], [-23.7032398, -46.552499], [-23.7034584, -46.5524024], [-23.7038219, -46.5522334], [-23.7041436, -46.5521288], [-23.7043057, -46.5520993], [-23.7045562, -46.5520671], [-23.7046495, -46.5520698], [-23.704873, -46.5520993], [-23.7050866, -46.5521556], [-23.7051652, -46.5521905], [-23.7052561, -46.5518338], [-23.7053224, -46.5515012], [-23.7053985, -46.5512705], [-23.7056392, -46.5506295], [-23.7058676, -46.5501735], [-23.706015, -46.5499079], [-23.7063858, -46.5491918], [-23.7065602, -46.5488699], [-23.706791, -46.5484166], [-23.71071054, -46.5478346], [-23.707405, -46.5474108], [-23.7076604, -46.5470889], [-23.7079846, -46.5467322], [-23.7084168, -46.5463299], [-23.7087704, -46.5460107], [-23.7091978, -46.54567], [-23.70928, -46.5456017], [-23.7097528, -46.5451873], [-23.7085249, -46.5454474], [-23.7084757, -46.5454635], [-23.7084242, -46.5454608], [-23.7083922, -46.545434], [-23.70838, -46.5453831], [-23.7086256, -46.5448305], [-23.7077881, -46.5444121], [-23.7074271, -46.5442458], [-23.7073608, -46.544227], [-23.706489, -46.5437603], [-23.7064251, -46.5437228], [-23.7046642, -46.5428269], [-23.7037703, -46.5424514], [-23.7036991, -46.5424138], [-23.7034731, -46.5422878], [-23.7033896, -46.5422636], [-23.7030581, -46.54221], [-23.70295, -46.5421751], [-23.7028247, -46.5421188], [-23.702724, -46.5420571], [-23.7024981, -46.541974], [-23.7024662, -46.542041], [-23.701808, -46.543704], [-23.7017687, -46.5438166], [-23.7016778, -46.5442565], [-23.7016385, -46.5444577], [-23.7015305, -46.5447232], [-23.7009729, -46.5458793], [-23.7005456, -46.5457398], [-23.7000249, -46.5456003], [-23.6997007, -46.5455145], [-23.6991702, -46.5454233], [-23.6989345, -46.5453804], [-23.6981191, -46.5451604], [-23.6980601, -46.5454233], [-23.6979864, -46.5461046], [-23.6978784, -46.5470863], [-23.6978342, -46.5473974], [-23.69779, -46.5480465], [-23.6977507, -46.5484756], [-23.697677, -46.5487653], [-23.6975051, -46.5491086], [-23.6968714, -46.5495195], [-23.6968174, -46.5506214], [-23.6966454, -46.5507877]
                ]
            }
        ];

        dadosSetoresKML.forEach(setor => {
            if (setor.coordenadas && setor.coordenadas.length > 0) {
                const polygon = L.polygon(setor.coordenadas, {
                    color: setor.cor,
                    weight: 2,
                    fillColor: setor.cor,
                    fillOpacity: 0.35
                }).addTo(map);
                polygon.bindPopup(`<b>SETOR: ${setor.nome}</b><br>${setor.descricao}`);
            }
        });

        function criarIconeViatura() {
            return L.divIcon({
                className: 'viatura-icon',
                html: '🚔',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(err);
                }
            }
        }

        async function liberarWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.error(err);
                }
            }
        }

        // --- BOTÃO DE TRANSCRIÇÃO DIRETA EM TEXTO ---
        btnTranscrever.addEventListener('click', () => {
            if (!recognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }

            if (!isTranscrevendo) {
                recognition.start();
            } else {
                recognition.stop();
            }
        });

        btnDitadoModal.addEventListener('click', () => {
            if (!recognition) {
                alert("Reconhecimento de voz indisponível.");
                return;
            }
            recognition.start();
        });

        if (recognition) {
            recognition.onstart = () => {
                isTranscrevendo = true;
                btnTranscrever.textContent = "🗣️ OUVINDO...";
                btnTranscrever.classList.add('ouvindo');
                btnDitadoModal.textContent = "🔴 Ouvindo...";
                instructionsDiv.innerHTML = "🗣️ FALE AGORA PARA TRANSCREVER...";
            };

            recognition.onresult = (event) => {
                const textoFalado = event.results[0][0].transcript.toUpperCase();
                
                // Se o modal de ocorrência estiver aberto, joga lá dentro. Senão, joga no campo de destino ou avisa.
                if (modalMarcar.style.display === "flex") {
                    inserirAtalho(textoFalado);
                } else {
                    inputDestino.value = textoFalado;
                }
                falarTexto("Texto capturado.");
            };

            recognition.onerror = (event) => {
                console.error("Erro no reconhecimento de voz:", event.error);
            };

            recognition.onend = () => {
                isTranscrevendo = false;
                btnTranscrever.textContent = "🗣️ FALA (TEXTO)";
                btnTranscrever.classList.remove('ouvindo');
                btnDitadoModal.textContent = "🎙️ Falar";
                instructionsDiv.innerHTML = "✅ TRANSCRIÇÃO CONCLUÍDA!";
            };
        }

        // --- GRAVAÇÃO DE ÁUDIO COMUM (ARQUIVO) ---
        btnAudio.addEventListener('click', async () => {
            if (!isGravandoAudio) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const horaAudio = new Date().toLocaleTimeString('pt-BR');
                        
                        audiosGravados.push({ hora: horaAudio, url: audioUrl, blob: audioBlob });
                        renderizarListaAudios();
                        falarTexto("Áudio salvo.");
                    };

                    mediaRecorder.start();
                    isGravandoAudio = true;
                    btnAudio.textContent = "⏹️ PARAR ÁUDIO";
                    btnAudio.classList.add('gravando-audio');
                    instructionsDiv.innerHTML = "🎙️ GRAVANDO ÁUDIO EM ARQUIVO...";
                } catch (err) {
                    alert("Erro ao acessar o microfone.");
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
                isGravandoAudio = false;
                btnAudio.textContent = "🎙️ ÁUDIO";
                btnAudio.classList.remove('gravando-audio');
                instructionsDiv.innerHTML = "✅ ÁUDIO ARMAZENADO NO PAINEL!";
            }
        });

        function renderizarListaAudios() {
            if (audiosGravados.length > 0) {
                containerAudiosSalvos.style.display = "block";
                listaAudiosElementos.innerHTML = "";
                audiosGravados.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'audio-item';
                    
                    const label = document.createElement('span');
                    label.style.fontSize = "10px";
                    label.textContent = `#${index + 1} (${item.hora})`;

                    const audioElem = document.createElement('audio');
                    audioElem.controls = true;
                    audioElem.src = item.url;

                    div.appendChild(label);
                    div.appendChild(audioElem);
                    listaAudiosElementos.appendChild(div);
                });
                painelRelatorio.style.display = "block";
            } else {
                containerAudiosSalvos.style.display = "none";
            }
        }

        function emitirSomSalvamento() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function obterNomeRuaPorCoord(lat, lon, callback) {
            const url = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${apiKey}&lang=pt`;
            fetch(url)
                .then(res => res.json())
                .then(result => {
                    let nomeFormatado = "VIA NÃO IDENTIFICADA";
                    if (result.features && result.features.length > 0) {
                        const props = result.features[0].properties;
                        const rua = props.street || props.name || "VIA SEM NOME";
                        const numero = props.housenumber ? `, ${props.housenumber}` : "";
                        const bairro = props.suburb || props.city || "";
                        nomeFormatado = bairro ? `${rua}${numero} (${bairro})` : `${rua}${numero}`;
                    }
                    if (callback) callback(nomeFormatado.toUpperCase());
                })
                .catch(() => { if (callback) callback("VIA NÃO IDENTIFICADA"); });
        }

        function atualizarPainelRelatorioDinamico() {
            let relatorioFormal = `RELATÓRIO DE SERVIÇO OPERACIONAL\n`;
            relatorioFormal += `DATA: ${new Date().toLocaleDateString('pt-BR')} | TEMPO: ${isGravando ? formatarTempo(segundosGravados) : 'CONCLUÍDO'}\n\n`;
            relatorioFormal += `HISTÓRICO DE OPERAÇÕES:\n`;

            let contadorItem = 1;
            if (registrosTrajeto.length > 0) {
                registrosTrajeto.forEach((ponto) => {
                    relatorioFormal += `${contadorItem}. ÀS ${ponto.hora} - LOCAL: ${ponto.rua.toUpperCase()}.\n`;
                    contadorItem++;
                });
            } else {
                relatorioFormal += `1. NENHUM REGISTRO DE ROTA INFORMADO AINDA.\n`;
            }

            if (pontosDeMelhoria.length > 0) {
                relatorioFormal += `\nALTERAÇÕES / PONTOS MARCADOS:\n`;
                pontosDeMelhoria.forEach((pm) => {
                    relatorioFormal += `• ÀS ${pm.hora} - ${pm.comentario} EM ${pm.rua.toUpperCase()};\n`;
                });
            }

            if (!textoRelatorioPronto || registrosTrajeto.length > 0 || pontosDeMelhoria.length > 0) {
                textoRelatorioPronto = relatorioFormal;
            }
            textoRelatorioVisivel.textContent = textoRelatorioPronto;
            painelRelatorio.style.display = "block";
        }

        function centralizarNaMinhaLocalizacao() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((position) => {
                ultimaLat = position.coords.latitude;
                ultimaLon = position.coords.longitude;
                origem = [ultimaLat, ultimaLon];
                map.setView(origem, 16);
                
                obterNomeRuaPorCoord(ultimaLat, ultimaLon, (nomeRua) => {
                    ruaAtualNome = nomeRua;
                    if (markerOrigem) map.removeLayer(markerOrigem);
                    markerOrigem = L.marker(origem, { icon: criarIconeViatura() }).addTo(map)
                        .bindPopup(`<b>LOCALIZAÇÃO ATUAL</b><br>${ruaAtualNome}`).openPopup();
                    instructionsDiv.innerHTML = `📍 <b>ORIGEM:</b> ${ruaAtualNome}`;
                });
            }, () => {
                map.setView([-23.5505, -46.6333], 13);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function avaliarRegistroPorDistanciaOuEndereco() {
            if (ultimaLat === null || ultimaLon === null) return;
            const novaCoord = [ultimaLat, ultimaLon];
            const horaAtual = new Date().toLocaleTimeString('pt-BR');

            obterNomeRuaPorCoord(ultimaLat, ultimaLon, (nomeRua) => {
                ruaAtualNome = nomeRua;
                let deveSalvar = false;
                if (!isGravando) return;

                if (!ultimaCoordenadaSalva) {
                    deveSalvar = true;
                } else {
                    const distancia = calcularDistanciaMetros(
                        ultimaCoordenadaSalva[0], ultimaCoordenadaSalva[1],
                        ultimaLat, ultimaLon
                    );
                    if (distancia >= distanciaMinimaMetros && ruaAtualNome !== ultimaRuaSalva && ruaAtualNome !== "VIA NÃO IDENTIFICADA") {
                        deveSalvar = true;
                    }
                }

                if (deveSalvar) {
                    ultimaCoordenadaSalva = novaCoord;
                    ultimaRuaSalva = ruaAtualNome;

                    registrosTrajeto.push({ hora: horaAtual, rua: ruaAtualNome, coordenadas: novaCoord });
                    atualizarPainelRelatorioDinamico();
                    emitirSomSalvamento();

                    if (trackLayer) map.removeLayer(trackLayer);
                    trackLayer = L.polyline(registrosTrajeto.map(i => i.coordenadas), { color: '#c0392b', weight: 5 }).addTo(map);
                    instructionsDiv.innerHTML = `📍 SALVO (${horaAtual}): <b>${ruaAtualNome}</b>`;
                }
            });
        }

        function iniciarRastreamentoGlobal() {
            if (!navigator.geolocation) return;
            watchId = navigator.geolocation.watchPosition((position) => {
                ultimaLat = position.coords.latitude;
                ultimaLon = position.coords.longitude;
                const novaCoord = [ultimaLat, ultimaLon];
                
                map.setView(novaCoord, map.getZoom());
                if (markerOrigem) map.removeLayer(markerOrigem);
                markerOrigem = L.marker(novaCoord, { icon: criarIconeViatura() }).addTo(map);

                if (isGravando) avaliarRegistroPorDistanciaOuEndereco();
            }, (err) => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        window.addEventListener('load', () => {
            centralizarNaMinhaLocalizacao();
            iniciarRastreamentoGlobal();
        });

        btnImportar.addEventListener('click', () => inputJson.click());
        btnFecharPainel.addEventListener('click', () => painelRelatorio.style.display = "none");

        btnLimpar.addEventListener('click', function() {
            if (confirm("Deseja realmente limpar os dados atuais?")) {
                if (isGravando) {
                    clearInterval(tempoGravacaoInterval);
                    liberarWakeLock();
                }
                isGravando = false;
                registrosTrajeto = [];
                pontosDeMelhoria = [];
                audiosGravados = [];
                containerAudiosSalvos.style.display = "none";
                ultimaCoordenadaSalva = null;
                ultimaRuaSalva = "";
                textoRelatorioPronto = "";
                textoRelatorioVisivel.textContent = "";
                painelRelatorio.style.display = "none";
                btnGravar.textContent = "🔴 GRAVAR";
                btnGravar.classList.remove('gravando');

                if (trackLayer) map.removeLayer(trackLayer);
                instructionsDiv.innerHTML = "🧹 PRONTO PARA NOVO REGISTRO.";
            }
        });

        btnGerarRelatorioModal.addEventListener('click', function() {
            atualizarPainelRelatorioDinamico();
            textareaRelatorioModal.value = textoRelatorioPronto;
            modalGerarRelatorio.style.display = "flex";
            textareaRelatorioModal.focus();
        });

        btnModalRelatorioCancelar.addEventListener('click', () => modalGerarRelatorio.style.display = "none");

        btnModalRelatorioSalvar.addEventListener('click', function() {
            textoRelatorioPronto = textareaRelatorioModal.value;
            textoRelatorioVisivel.textContent = textoRelatorioPronto;
            modalGerarRelatorio.style.display = "none";
            falarTexto("Relatório atualizado.");
        });

        btnWhatsapp.addEventListener('click', function() {
            if (!textoRelatorioPronto) return;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRelatorioPronto)}`, '_blank');
        });

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600);
            const m = Math.floor((segundos % 3600) / 60);
            const s = segundos % 60;
            return (h > 0 ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        btnGravar.addEventListener('click', async function() {
            if (!isGravando) {
                if (!navigator.geolocation) { alert("GPS NÃO SUPORTADO."); return; }
                isGravando = true;
                segundosGravados = 0;

                if (ultimaLat !== null && ultimaLon !== null) avaliarRegistroPorDistanciaOuEndereco();

                btnGravar.classList.add('gravando');
                solicitarWakeLock();
                
                tempoGravacaoInterval = setInterval(() => {
                    segundosGravados++;
                    btnGravar.innerHTML = `⏹️ ${formatarTempo(segundosGravados)}`;
                    atualizarPainelRelatorioDinamico();
                }, 1000);
                falarTexto("Gravação iniciada.");
            } else {
                isGravando = false;
                clearInterval(tempoGravacaoInterval);
                liberarWakeLock();
                
                btnGravar.textContent = "🔴 GRAVAR";
                btnGravar.classList.remove('gravando');
                instructionsDiv.innerHTML = "✅ GRAVAÇÃO ENCERRADA!";
                falarTexto("Gravação encerrada.");
                atualizarPainelRelatorioDinamico();
            }
        });

        let coordsAtuaisPendentes = null;
        let ruaAtualPendente = "";

        btnMarcar.addEventListener('click', function() {
            if (ultimaLat === null || ultimaLon === null) { 
                alert("AGUARDANDO SINAL DE GPS ATUAL."); 
                return; 
            }

            const horaAtual = new Date().toLocaleTimeString('pt-BR');
            coordsAtuaisPendentes = [ultimaLat, ultimaLon];

            obterNomeRuaPorCoord(ultimaLat, ultimaLon, (ruaEncontrada) => {
                ruaAtualPendente = ruaEncontrada;
                modalTituloLocal.textContent = `LOCAL: ${ruaEncontrada} ÀS ${horaAtual}`;
                textareaOcorrencia.value = "ABORDAGEM REALIZADA";
                modalMarcar.style.display = "flex";
                textareaOcorrencia.focus();
            });
        });

        btnModalCancelar.addEventListener('click', () => modalMarcar.style.display = "none");

        btnModalOk.addEventListener('click', function() {
            const nota = textareaOcorrencia.value.trim();
            if (nota !== "") {
                const horaAtual = new Date().toLocaleTimeString('pt-BR');
                const notaUpper = nota.toUpperCase();

                pontosDeMelhoria.push({ hora: horaAtual, rua: ruaAtualPendente, coordenadas: coordsAtuaisPendentes, comentario: notaUpper });
                atualizarPainelRelatorioDinamico();

                const m = L.marker(coordsAtuaisPendentes).addTo(map).bindPopup(`<b>${ruaAtualPendente}</b><br>${notaUpper}`).openPopup();
                marcadoresMelhoriaLayers.push(m);
                falarTexto("Ponto marcado.");
            }
            modalMarcar.style.display = "none";
        });

        btnLocalizacao.addEventListener('click', centralizarNaMinhaLocalizacao);
    </script>
</body>
